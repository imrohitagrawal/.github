name: PR Quality Gate (reusable)

# Reusable quality gate called by each consuming repo's caller-pr-quality.yml.
# Performs deterministic checks: lint, type check, tests, security scans (bandit, semgrep,
# gitleaks), and dependency audit. Adapts to whatever language/tooling the target repo has.
#
# Severity rule: lint, type check, tests and build FAIL the check. Dependency and
# static-security scanners (npm audit, bandit, pip-audit) are ADVISORY and each says
# so at its own step, with the condition that would make it blocking. Nothing here is
# silently advisory: a gate whose header promises more than its steps deliver is a
# badge, not a gate.
#
# History: until 2026-08-11 npm lint/typecheck/test/build all carried
# `continue-on-error: true` and pytest/bandit/pip-audit were `|| echo ...`, so for a
# Node repo NOTHING but gitleaks could fail this gate while the header said
# "any failure here fails the check". Branch protection / rulesets in the
# consuming repo decide whether a failed check blocks merge. On GitHub Free for public
# repos, branch protection can require this check. On GitHub Free for private repos,
# branch protection / rulesets may be limited — see docs/branch-protection.md.
#
# Tools used (all free, open-source):
#   - Python: ruff, mypy, pytest, bandit, pip-audit
#   - Node:   npm ci, npm audit
#   - Cross-language: gitleaks (secrets), semgrep OSS (security patterns)

on:
  workflow_call:

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- Always run: secret scan ----------
      - name: Detect secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # ---------- Always run: cross-language security patterns ----------
      - name: Semgrep OSS security scan
        if: hashFiles('semgrep.yml', '.semgrep.yml', '.semgrep/', 'semgrep/') != ''
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            ${{ hashFiles('semgrep.yml') != '' && 'semgrep.yml' ||
                 hashFiles('.semgrep.yml') != '' && '.semgrep.yml' ||
                 hashFiles('.semgrep/') != '' && '.semgrep/' ||
                 hashFiles('semgrep/') != '' && 'semgrep/' ||
                 'p/security-audit p/secrets p/owasp-top-ten' }}

      # ---------- Detect language and dispatch ----------
      - name: Detect project layout
        id: detect
        run: |
          echo "has_makefile_ci=$([ -f Makefile ] && grep -q '^ci:' Makefile && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_package_json=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_python=$([ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_mypy_config=$([ -f mypy.ini ] || [ -f .mypy.ini ] || [ -f pyproject.toml ] && grep -q '\[tool.mypy\]' pyproject.toml 2>/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "uses_uv=$([ -f Makefile ] && grep -qE '(^|[^a-zA-Z])uv([^a-zA-Z]|$)' Makefile && echo true || ([ -f pyproject.toml ] && [ -f uv.lock ] && echo true || echo false))" >> "$GITHUB_OUTPUT"
          echo "uses_node=$([ -f .nvmrc ] || [ -f .node-version ] || grep -qE '(^|[^a-zA-Z])(nvm|node)([^a-zA-Z]|$)' Makefile 2>/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # ---------- Tooling install (needed by Path 1 — make ci) ----------
      - name: Install uv (Python 3.12)
        if: steps.detect.outputs.uses_uv == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install Node.js
        if: steps.detect.outputs.has_package_json == 'true' || steps.detect.outputs.uses_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------- System Python for non-uv Python projects ----------
      - name: Set up Python
        if: steps.detect.outputs.has_python == 'true' && steps.detect.outputs.uses_uv != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---------- Path 1: Makefile-driven ----------
      - name: Run make ci
        if: steps.detect.outputs.has_makefile_ci == 'true'
        run: make ci

      # ---------- Path 2: Node ----------
      - name: npm ci
        if: steps.detect.outputs.has_package_json == 'true'
        run: npm ci

      - name: npm lint
        if: steps.detect.outputs.has_package_json == 'true'
        run: npm run lint --if-present

      - name: npm typecheck
        if: steps.detect.outputs.has_package_json == 'true'
        run: npm run typecheck --if-present

      - name: npm test
        if: steps.detect.outputs.has_package_json == 'true'
        run: npm test --if-present

      - name: npm build
        if: steps.detect.outputs.has_package_json == 'true'
        run: npm run build --if-present

      # ADVISORY. A transitive dev-dependency advisory with no fix available would
      # otherwise block every unrelated PR in the repo. BLOCKING WHEN: the repo adds an
      # `audit-ci` config or an allowlist, so a finding means an unreviewed one — then
      # drop the `|| true`.
      - name: npm audit (high+) — advisory
        if: steps.detect.outputs.has_package_json == 'true'
        run: npm audit --audit-level=high || echo "::warning::npm audit found high+ advisories (advisory step, not blocking)"

      # ---------- Path 3: Python ----------
      # NOTE: no `setup-python` here. A second one used to sit at this point pinned to
      # '3.11', running unconditionally for any Python repo — so it overrode the 3.12
      # step above and silently undid the v3 commit titled "Pin Python 3.12 in reusable
      # quality gate". Python is set up once, above, at 3.12.

      - name: pip install tools
        if: steps.detect.outputs.has_python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest mypy bandit pip-audit

      - name: pip install -r requirements.txt
        if: steps.detect.outputs.has_python == 'true'
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi

      - name: ruff check
        if: steps.detect.outputs.has_python == 'true'
        run: ruff check .

      # BLOCKING. This previously read `pytest -q || echo "pytest failed"`, which
      # swallowed the exit code AND printed a line that reads like a failure report
      # while the job went green. A red test suite must fail the gate.
      - name: pytest
        if: steps.detect.outputs.has_python == 'true' && hashFiles('tests/', 'test/', 'pytest.ini', 'pyproject.toml') != ''
        run: pytest -q

      - name: mypy
        if: steps.detect.outputs.has_python == 'true' && steps.detect.outputs.has_mypy_config == 'true'
        run: mypy .

      # ADVISORY. Bandit's false-positive rate on application code is high enough that
      # blocking on a bare run would train people to ignore it. BLOCKING WHEN: the repo
      # ships a `.bandit` / `bandit.yaml` baseline, so a finding is a NEW finding.
      - name: bandit — advisory
        if: steps.detect.outputs.has_python == 'true'
        run: bandit -r . -x tests,test,node_modules,.venv,venv || echo "::warning::bandit reported findings (advisory step, not blocking)"

      # ADVISORY, same reasoning as npm audit. BLOCKING WHEN: the repo pins an
      # ignore-list, so a finding means an unreviewed one.
      - name: pip-audit — advisory
        if: steps.detect.outputs.has_python == 'true'
        run: pip-audit || echo "::warning::pip-audit reported findings (advisory step, not blocking)"

      # ---------- Fallback: nothing matched ----------
      - name: No recognized project files
        if: steps.detect.outputs.has_makefile_ci == 'false' && steps.detect.outputs.has_package_json == 'false' && steps.detect.outputs.has_python == 'false'
        run: |
          echo "::notice::No Makefile ci target, package.json, or Python project files detected."
          echo "::notice::Falling back to secret scan only. Consider adding a Makefile or language manifest."