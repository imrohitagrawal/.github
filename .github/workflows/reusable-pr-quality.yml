name: PR Quality Gate (reusable)

# Reusable quality gate called by each consuming repo's caller-pr-quality.yml.
# Performs deterministic checks: lint, type check, tests, security scans (bandit, semgrep,
# gitleaks), and dependency audit. Adapts to whatever language/tooling the target repo has.
#
# Severity rule: lint, type check, tests and build FAIL the check. Dependency and
# static-security scanners (npm audit, bandit, pip-audit) are ADVISORY BY DEFAULT and
# each says so at its own step, with the condition that promotes it to blocking - as of
# WP5 that promotion is enforced by machine-checked `if:` logic (a matching
# config/baseline/ignore-list file selects the blocking variant of the step), not just
# a comment describing what should happen (F10). Nothing here is silently advisory: a
# gate whose header promises more than its steps deliver is a badge, not a gate.
#
# History: until 2026-08-11 npm lint/typecheck/test/build all carried
# `continue-on-error: true` and pytest/bandit/pip-audit were `|| echo ...`, so for a
# Node repo NOTHING but gitleaks could fail this gate while the header said
# "any failure here fails the check". Branch protection / rulesets in the
# consuming repo decide whether a failed check blocks merge. On GitHub Free for public
# repos, branch protection can require this check. On GitHub Free for private repos,
# branch protection / rulesets may be limited — see docs/branch-protection.md.
#
# Tools used (all free, open-source):
#   - Python: ruff, mypy, pytest, bandit, pip-audit
#   - Node:   npm ci, npm audit (or the `audit-ci` CLI instead, once the repo ships an
#     audit-ci config - see WP5 below)
#   - Cross-language: gitleaks (secrets, always), semgrep OSS (only if the repo
#     ships its own semgrep config - see the step)
#
# WP6 (per-stack directory inputs): `python-directory`/`node-directory` let a
# monorepo (Python in one subdirectory, Node in another - e.g. citevyn's
# backend/ + frontend/) declare its real layout instead of relying on
# root-only auto-detect, which sees nothing there and skips every native
# step. Both default to '.', so a caller that passes neither input gets
# exactly today's root-only behavior - this is additive and backward
# compatible for v3/v4-pinned consumers, who don't get this file at all
# until they repin, and for any v5+ consumer that doesn't set the inputs.
# An explicitly-passed value that's empty or doesn't exist fails the job
# fast (see "Validate directory inputs" below) instead of silently
# disabling that stack while the gate still reports green - default:
# only applies when the input is omitted, not when it's passed as ''.
#
# WP5 (tool-correct promotion, F10): npm audit / bandit / pip-audit are ADVISORY by
# default; each has a BLOCKING twin step that runs instead once the repo declares it
# wants stricter enforcement. Detection is per-stack (python-directory/node-directory,
# WP6), not root-only, so it doesn't inherit F5's monorepo blind spot for the exact
# repos (citevyn-shaped) most likely to actually add these files.
#   - npm audit -> blocking when node-directory has an audit-ci config: checked as
#     audit-ci.jsonc, then audit-ci.json, then .audit-ci.json (this workflow's own
#     detection convention, in that priority order - audit-ci itself has no default
#     filename to auto-discover; its CLI always takes an explicit `--config <path>`,
#     verified by reading audit-ci 7.1.0's own source (`yargs(...).config("config", ...)`
#     - the flag is required, nothing is searched for automatically). Promotion actually
#     runs the `audit-ci` tool via `npx`, not bare `npm audit` - bare `npm audit` has no
#     way to consume an allowlist at all, which is what F10's Codex-review correction
#     caught in the original (unimplemented) design.
#   - bandit -> blocking when python-directory has a generated baseline JSON at
#     `.bandit-baseline.json` (this workflow's own filename convention - generate one
#     with `bandit -r . -f json -o .bandit-baseline.json`), passed via `-b`/`--baseline`.
#     Deliberately NOT keyed off `.bandit`/`bandit.yaml`: those are bandit CLI config
#     (excluded paths, severity/confidence thresholds), not a baseline report, and
#     passing one to `-b` fails outright - `.bandit`/`bandit.yaml` was F10's original,
#     tool-incorrect promotion condition (Codex review correction).
#   - pip-audit -> blocking when python-directory has a `.pip-audit-ignore` file (one
#     vulnerability ID per line, blank lines and `#`-comments ignored - this workflow's
#     own convention, since pip-audit ships no config-file allowlist mechanism at all),
#     each surviving line passed as its own `--ignore-vuln <ID>`.
# All three also separate "the scanner ran and found something real" from "the scanner
# itself failed to run" (crashed, offline, registry/vuln-service unreachable) - the
# pre-WP5 `|| echo` on every one of these steps swallowed both identically, so a dead
# tool and a clean run were indistinguishable from the job's own output.
#   - bandit's exit codes already separate this on their own (verified by reading
#     bandit 1.9.4's source, bandit/cli/main.py: 0 = no issues, 1 = issues found at/above
#     threshold, 2 = bandit itself failed - bad CLI args, unreadable baseline file,
#     etc.) - no output-sniffing needed, just branch on the exit code.
#   - npm audit and pip-audit both reuse exit 1 for BOTH "found something" and
#     "crashed" (verified locally, pinned versions: npm audit --audit-level=high against
#     an unreachable --registry, and pip-audit against a forced VulnServiceConnectionError
#     both exit 1, same as a real finding). For these two, the step captures the tool's
#     output and checks for a signal the tool only emits on a genuine report before
#     deciding advisory-warn vs. hard-fail: npm audit --json's response has a
#     "vulnerabilities" key on a real report and only an "error" key when it crashed;
#     pip-audit prints its own "Found N known vulnerabilit(y|ies)…" summary line only
#     on a genuine report (verified against pip-audit 2.10.1's source, pip_audit/_cli.py
#     - fatal errors take a completely different code path, `_fatal()`, that never
#     prints this line). Either way, a crash fails the step outright instead of being
#     swallowed as if it were routine advisory noise.
#
# WP7 (target architecture point 3, F6/F7 - the severity-policy split): trusting an
# opaque `make ci` completely isn't centralization, it's relabeling the status quo -
# severity is still decided per-repo, inside each repo's own Makefile, wherever `make
# ci` happens to call `set -e`, `|| true`, etc. The actual fix implemented here: when
# the root Makefile defines a discrete `lint:`, `typecheck:`, or `test:` target (grep
# '^lint:' etc. - see "Detect project layout" below), this workflow invokes that
# target as ITS OWN step, with ITS OWN severity - blocking, exactly like the native
# npm/Python step for that same check - and the native step for that SAME check is
# skipped (its `if:` now also requires the matching `has_makefile_<check> == 'false'`,
# AND - see the STACK-DIRECTORY-AWARE SKIP bullet below, a review fix, not part of the
# original design - that stack's own directory input to be '.'). That makes there be
# exactly ONE severity decision per check (lint, typecheck, test) for a root-only repo,
# never two that can silently disagree about which one's exit code the job actually
# obeys.
#   - `make ci` remains a FALLBACK ONLY, for a Makefile with a `ci:` target but NONE
#     of the three discrete targets above - documented at that step as a
#     consumer-owned escape hatch: the repo's own Makefile, not this workflow, decides
#     severity for whatever `make ci` bundles together. KNOWN, ACCEPTED RESIDUAL: in
#     that fallback case specifically, the native npm/Python steps are NOT skipped -
#     there is no discrete per-check signal to key a skip off (an opaque `make ci`
#     might cover lint, typecheck, tests, all three, or none; this workflow can't tell
#     from the outside), so a repo using ONLY opaque `make ci` keeps today's
#     collision-prone F6/F7 behavior where both paths run and whichever finishes last
#     wins. This is a deliberate, documented gap for that one shape of repo, distinct
#     from repos with discrete targets (citevyn's own Makefile already has separate
#     lint/typecheck/test targets), which get the real fix described above.
#   - KNOWN, ACCEPTED RESIDUAL (review-caught, not the original design intent): the
#     `make ci` fallback's `if:` (see "Run make ci" below) requires ALL THREE
#     has_makefile_<check> outputs to be 'false' before it runs. A Makefile with, say,
#     only a discrete `lint:` target plus a `ci:` recipe that does more than
#     `lint typecheck test` (a bundled build/artifact-check step with no discrete-target
#     equivalent) would have that extra work silently never invoked - `make lint`
#     covers the lint part, nothing runs the rest of `ci:`. citevyn's own `ci:` target
#     is exactly `lint typecheck test`, the literal union of the three discrete
#     targets (verified against its Makefile), so this doesn't lose any coverage for
#     the one real consumer today - but it's a real gap for a differently-shaped repo,
#     and this workflow has no way to inspect what a `ci:` recipe actually does to
#     detect that case from the outside. Left undetected/unfixed rather than guessed
#     at, same posture as the opaque-`make ci`-only residual above.
#   - STACK-DIRECTORY-AWARE, CONTENT-AWARE SKIP (H2/H7 review fix, supersedes an
#     earlier directory-only version of this same fix): root-only Makefile detection
#     (has_makefile_<check>) cannot tell WHICH stack a discrete target actually
#     covers, or whether it does anything relevant to that check at all - just that a
#     target with that name exists (`grep -q '^lint:' Makefile`). That produces two
#     opposite failure modes:
#       - directory == '.': the original WP7 design trusted ANY same-named target
#         unconditionally, including a no-op placeholder - reproduced (H2): a
#         Makefile with `lint: @echo unrelated` plus a genuinely failing native lint
#         script skipped the one step that would have caught it, gate reported green.
#       - directory != '.': the first review fix for this (still shipped in some
#         history) never trusted a root target for a non-root stack AT ALL, regardless
#         of content - citevyn's own real `test: cd backend && uv run pytest` target,
#         with `python-directory: backend`, got zero credit even though it
#         demonstrably already covers that exact directory, so the native pytest step
#         re-ran the same suite on every single PR (measured, H7: ~70-80% of total job
#         wall-clock was pure duplicate work).
#     Both are one root cause (trust-by-name, not trust-by-content), fixed by one
#     mechanism instead of two separate patches: `trust_makefile_<check>_for_<node|
#     python>` (computed in "Detect project layout" below, replacing
#     has_makefile_<check> in each native step's own skip condition ONLY - "Run make
#     <check>" above still runs whenever has_makefile_<check> is true regardless of
#     trust; running an untrusted target is harmless, it just means the native step
#     also runs). A target is trusted for a given stack directory when its recipe body
#     is non-trivial (not just comments/`echo`/`true`/`exit 0` - closes the
#     directory=='.' false-green case) AND, for a non-root directory, the recipe's own
#     text mentions that directory by name (closes the directory!='.' redundant-cost
#     case). This is a documented, bounded heuristic, not full static analysis - a
#     recipe reading `cd backend && echo "not really running anything"` would still
#     pass it. KNOWN, ACCEPTED RESIDUAL, same posture as every other documented
#     trade-off in this file: narrower than perfect verification, chosen because it's
#     the signal already available (the recipe's own text) rather than executing it
#     speculatively to find out.
#   - Security/audit steps (bandit, npm audit, pip-audit) are unaffected by WHICH
#     Makefile path (discrete targets vs. `make ci` fallback vs. neither) is in play -
#     they keep running per-stack-directory as WP5 already wired them, based on
#     has_python/has_package_json alone. That independence is from Makefile-path
#     *selection* only, not from the job's own step-to-step control flow: like every
#     step in this job, they still carry GitHub's implicit `success()` AND, so an
#     earlier failing step (native or Makefile-driven) still skips them outright -
#     that's the separate, already-recorded WP6-residual immediately below, not
#     something this bullet claims to have solved.
#
# WP6-residual evaluation (deferred, not silently dropped): WP6's own review left a
# recorded residual - GitHub Actions implicitly ANDs `success()` onto any step whose
# `if:` doesn't already reference a status-check function, and `success()` evaluates
# against the WHOLE job's steps so far, not just the one step this step actually
# depends on. Concretely: if an earlier Node-stack step (npm lint/typecheck/test, or
# now `make lint`/`typecheck`/`test`) fails, every later step - including unrelated
# Python-stack steps like ruff/pytest/mypy/bandit/pip-audit - gets skipped outright
# instead of running and reporting independently, even though nothing about their own
# `if:` conditions says they should be. WP6's note suggested revisiting this "when
# WP7 next restructures this job" using `!cancelled()` combined with an explicit
# check that the SPECIFIC prior step a given step depends on succeeded (e.g. `ruff
# check` should be gated on `pip install tools` having succeeded, not on `npm lint`
# having succeeded three unrelated steps earlier). Evaluated here, on purpose, before
# writing WP7's own conditionals: a correct scoped fix needs every Path 2/3 step to
# carry an explicit `id:` and a hand-written per-step dependency chain
# (`!cancelled() && steps.<the one real prior dependency>.outcome == 'success'`) -
# roughly 15 steps' worth of `if:` rewrites, done carefully enough that a Node-stack
# step doesn't accidentally start running `!cancelled()`-gated after ITS OWN real
# prerequisite (e.g. `npm ci`) failed, which blanket-adding `!cancelled()` without the
# chained check would cause. That is a distinct, job-control-flow change from WP7's
# severity-resolution change, and bundling both increases the odds of a subtle new
# ordering bug landing in the same PR as the intended fix. Judged too large to fold
# into this package safely: DEFERRED to its own follow-up work package (not
# implemented here, and not silently left undocumented either) - WP7's own new steps
# (`make lint`/`typecheck`/`test`) inherit the same implicit-success() coupling as
# every existing step in this job, so the residual is unchanged in shape, only in
# which steps it can now affect.
#
# Single job, deliberately (see the "Aggregator" note below `jobs:`) - one
# job name is already the one stable required-status-check name branch
# protection needs, regardless of which stacks are present.

on:
  workflow_call:
    inputs:
      python-directory:
        description: >-
          Directory (relative to repo root) containing the Python project
          (pyproject.toml/requirements.txt/setup.py, mypy config, tests).
          Defaults to '.' - today's root-only behavior. If explicitly set,
          must reference a directory that exists - the gate fails fast
          rather than silently skipping the Python stack.
        required: false
        type: string
        default: '.'
      node-directory:
        description: >-
          Directory (relative to repo root) containing the Node project
          (package.json). Defaults to '.' - today's root-only behavior. If
          explicitly set, must reference a directory that exists - the gate
          fails fast rather than silently skipping the Node stack.
        required: false
        type: string
        default: '.'

permissions:
  contents: read
  pull-requests: read

# Aggregator note (WP6, target architecture point 2): the plan's default
# design splits Python/Node checks into their own jobs plus a final
# `needs: [...]` + `if: always()` aggregator job, so branch protection can
# require one stable name while stacks run/report independently. This PR
# deliberately keeps the single-job design instead:
#   - A single job's name is already the one stable check branch protection
#     requires, whether Python, Node, both, or neither ran - steps skip via
#     `if:`, the job itself does not, so there is no "a required job quietly
#     reports skipped and counts as green" failure mode to guard against.
#     That failure mode is specific to the *multi-job* design the plan
#     considered - splitting into jobs would introduce it, then need the
#     aggregator to fix it. A single job never has it.
#   - Splitting python/node into parallel jobs would also require deciding
#     where gitleaks/semgrep (today: always-run, once, ahead of both stacks)
#     and `make ci` (today: a fallback ahead of both native paths) live in a
#     multi-job graph, plus whether existing consumers' branch protection
#     (pinned to today's single check name, e.g. "quality-gate") breaks on
#     upgrade - real design questions, out of scope for "add per-stack
#     directory inputs."
# Restructuring into parallel per-stack jobs remains a legitimate follow-up
# if/when Python and Node checks need to run concurrently for wall-clock
# time (they run sequentially today, same as before this change) - tracked
# as explicit future work, not silently dropped.
jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # ---------- WP6 hardening: fail closed on bad directory inputs ----------
      # `default: '.'` only kicks in when an input is OMITTED. A caller that computes
      # python-directory/node-directory dynamically and passes '' gets that empty
      # string verbatim, which then flows into "$DIR/pyproject.toml" etc. as
      # "/pyproject.toml" - a filesystem-root check that quietly finds nothing. A
      # misspelled or moved directory has the same failure shape: the stack it names
      # is just treated as absent. Either way the gate can still report green while an
      # explicitly-declared stack silently gets no lint/typecheck/test/build/audit -
      # exactly the "check quietly finds nothing, job still reports green" failure
      # mode WP6 exists to fix. Reject both cases here, before any other step relies
      # on these values, rather than failing open.
      - name: Validate directory inputs
        env:
          PYTHON_DIR: ${{ inputs.python-directory }}
          NODE_DIR: ${{ inputs.node-directory }}
        run: |
          if [ -z "$PYTHON_DIR" ]; then
            echo "::error::python-directory was explicitly set to an empty string. Omit the input (or pass '.') to use the repo root."
            exit 1
          fi
          if [ -z "$NODE_DIR" ]; then
            echo "::error::node-directory was explicitly set to an empty string. Omit the input (or pass '.') to use the repo root."
            exit 1
          fi
          if [ ! -d "$PYTHON_DIR" ]; then
            echo "::error::python-directory '$PYTHON_DIR' does not exist in this repository."
            exit 1
          fi
          if [ ! -d "$NODE_DIR" ]; then
            echo "::error::node-directory '$NODE_DIR' does not exist in this repository."
            exit 1
          fi

      # ---------- Always run: secret scan ----------
      # v3, not v2: v2.3.9 runs on the node20 Actions runtime, which GitHub is
      # actively deprecating — Node 24 became the runner default on 2026-06-02
      # (node20 actions keep running only with ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION=true,
      # not set here) and node20 is removed from GitHub-hosted runners entirely on
      # 2026-09-16, breaking this step outright. v3.0.0 is a drop-in node24 rebuild
      # with, per its release notes, "no changes to inputs, outputs, or behavior".
      # No GITLEAKS_LICENSE: gitleaks-action only requires one for
      # Organization-owned callers (it looks up the calling repo owner's
      # GitHub account type and hard-fails with process.exit(1) if the var
      # is missing there) - not for OSS-vs-paid gitleaks features generically.
      # Every caller of this workflow lives under the personal account
      # @imrohitagrawal (this repo's own scope - see README.md), which
      # gitleaks-action exempts from the license check, so no caller needs
      # one today. Note for the future: if this workflow is ever reused by
      # an organization-owned caller, that caller must set `secrets: inherit`
      # (workflow_call callers get no secrets otherwise) AND this step must
      # re-add `GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}` -
      # otherwise gitleaks-action fails every PR for that org.
      - name: Detect secrets with gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------- Cross-language security patterns ----------
      # NOT "always run": the `if` requires the repo to ship its own semgrep config -
      # turning semgrep on for every repo is a real decision with real noise, not
      # something to silently widen as a side effect of fixing the step underneath it.
      #
      # WP4/F9: direct CLI, not returntocorp/semgrep-action@v1 or semgrep/semgrep-action
      # - both confirmed deprecated/archived 2026-08-12 via `gh api repos/<owner>/semgrep-action`.
      # returntocorp/semgrep-action's own description reads "This project is deprecated.
      # Use https://github.com/semgrep/semgrep instead"; the same-vintage semgrep/semgrep-action
      # is `archived:true` and its description points to "returntocorp/semgrep" - which
      # itself resolves (GitHub's org-rename redirect, returntocorp -> semgrep) to that
      # same live, actively-maintained semgrep/semgrep CLI repo (pushed within the last
      # day as of this check), not to a dead or circular target. Both wrapper Actions
      # converge on the one thing that's actually still maintained: the CLI itself -
      # which is exactly what this step now runs directly, so neither wrapper is worth
      # depending on. Using the semgrep/semgrep Docker image directly (pinned by digest,
      # same no-floating-tag rule WP2 applied to every GitHub Action here) avoids both
      # wrappers, and avoids a bare `pip install semgrep` hitting PEP 668's "externally
      # managed environment" block on the runner's system Python - this step runs before
      # "Set up Python" below, which is itself gated on has_python and would skip
      # entirely for a Node-only repo with a semgrep config.
      #
      # WP4/F21: the `if:` above already requires one of the four config paths below
      # to exist before this step runs at all, so the config-source expression can
      # never fall through to "none matched" - the old 5th branch (a default ruleset)
      # was dead code by construction, removed here rather than left for the next
      # person to puzzle over.
      #
      # WP4 review fix: `semgrep ci` (what returntocorp/semgrep-action ran) only reports
      # findings introduced by the current PR/MR diff; plain `semgrep scan` has no such
      # awareness and blocks on every finding in the whole current tree every time. But
      # `semgrep ci` also flatly refuses a custom `--config` ("Not supported in 'ci'
      # mode" - confirmed via `semgrep ci --help` against this pinned image), which this
      # step needs to run the repo's own config instead of a Semgrep-App-managed policy.
      # `--baseline-commit` on `semgrep scan` restores the diff-aware behavior without
      # giving up `--config`: verified locally that a pre-existing finding untouched by
      # the PR's commits is correctly excluded (exit 0) while a finding newly introduced
      # by the PR's commits is still caught (exit 1). Every real caller of this reusable
      # workflow is pull_request-triggered (templates/caller-pr-quality.yml), and a
      # reusable workflow's jobs share the same run/event payload as the caller, so
      # `github.event.pull_request.base.sha` is populated here exactly as it would be in
      # a plain (non-reusable) job on that same trigger. `fetch-depth: 0` on the checkout
      # step above already gives the container's bind-mounted .git the full history
      # `--baseline-commit` needs to diff against.
      - name: Semgrep OSS security scan
        if: hashFiles('semgrep.yml', '.semgrep.yml', '.semgrep/', 'semgrep/') != ''
        env:
          SEMGREP_CONFIG: >-
            ${{ hashFiles('semgrep.yml') != '' && 'semgrep.yml' ||
                 hashFiles('.semgrep.yml') != '' && '.semgrep.yml' ||
                 hashFiles('.semgrep/') != '' && '.semgrep/' ||
                 'semgrep/' }}
          SEMGREP_BASELINE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          BASELINE_ARGS=()
          if [ -n "$SEMGREP_BASELINE_COMMIT" ]; then
            BASELINE_ARGS=(--baseline-commit "$SEMGREP_BASELINE_COMMIT")
          fi
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep@sha256:a8298d1c09c84b9a0bbc75ec915e37023fc4657360b6dbfa645261d2353a366c \
            semgrep scan --error --config "$SEMGREP_CONFIG" "${BASELINE_ARGS[@]}"

      # ---------- Detect language and dispatch ----------
      # WP6: file checks below are relative to python-directory/node-directory
      # (both default '.', i.e. repo root - today's behavior when unset).
      # has_makefile_ci and the WP7 has_makefile_{lint,typecheck,test} outputs all
      # stay root-only, deliberately - see "Run make ci" / "Run make lint" etc. below.
      # WP5: also detects the per-tool promotion files (see the WP5 comment block
      # above `jobs:` for what each one is and why). Same stack-aware directories as
      # everything else in this step.
      - name: Detect project layout
        id: detect
        env:
          PYTHON_DIR: ${{ inputs.python-directory }}
          NODE_DIR: ${{ inputs.node-directory }}
        run: |
          echo "has_makefile_ci=$([ -f Makefile ] && grep -q '^ci:' Makefile && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # WP7 (F6/F7, target architecture point 3): discrete targets, checked
          # independently of `ci:` above - a Makefile can have a `ci:` target, discrete
          # targets, both, or neither. Same `[ -f Makefile ] && grep -q '^<target>:'
          # Makefile && echo true || echo false` shape as has_makefile_ci - an AND
          # chain ending in `echo true`, falling through to `echo false` on any short
          # circuit, so this does NOT reproduce the mixed OR/AND binding bug the
          # has_mypy_config comment below warns about (that one chains `||` before
          # `&& grep`; this one doesn't).
          HAS_MAKEFILE_LINT=$([ -f Makefile ] && grep -q '^lint:' Makefile && echo true || echo false)
          HAS_MAKEFILE_TYPECHECK=$([ -f Makefile ] && grep -q '^typecheck:' Makefile && echo true || echo false)
          HAS_MAKEFILE_TEST=$([ -f Makefile ] && grep -q '^test:' Makefile && echo true || echo false)
          echo "has_makefile_lint=$HAS_MAKEFILE_LINT" >> "$GITHUB_OUTPUT"
          echo "has_makefile_typecheck=$HAS_MAKEFILE_TYPECHECK" >> "$GITHUB_OUTPUT"
          echo "has_makefile_test=$HAS_MAKEFILE_TEST" >> "$GITHUB_OUTPUT"

          # H2/H7 review fix: has_makefile_<check> above is presence-only ("a target
          # with this name exists"). trust_makefile_<check>_for_<node|python> below is
          # the content-aware signal each native step's own skip condition actually
          # uses - see the WP7 header comment's "STACK-DIRECTORY-AWARE, CONTENT-AWARE
          # SKIP" bullet for the full mechanism and why. Captured as shell functions
          # (not inlined) since this needs to run up to 6 times (3 checks x 2 stacks)
          # with the same logic - defined here, used immediately below, both scoped to
          # this one step's single shell invocation (functions don't persist across
          # steps).
          extract_makefile_recipe() {
            # $1 = target name. Prints every tab-indented line following that
            # target's own line, stopping at the first non-indented line - a
            # standard Makefile recipe block.
            awk -v t="^$1:" '$0 ~ t {f=1; next} /^[^\t]/ {f=0} f' Makefile
          }
          is_trivial_makefile_recipe() {
            # stdin = recipe body. Trivial = every surviving line is empty, a
            # comment, or a bare no-op invocation (@?echo/@?true/@?:/@?exit 0).
            ! grep -vqE '^[[:space:]]*(@?[[:space:]]*(#.*)?$|@?[[:space:]]*(echo|true|:|exit[[:space:]]+0)([[:space:]].*)?$)'
          }
          compute_makefile_trust() {
            # $1 = check name (lint/typecheck/test), $2 = that stack's directory
            # input value.
            has=""
            case "$1" in
            lint) has="$HAS_MAKEFILE_LINT" ;;
            typecheck) has="$HAS_MAKEFILE_TYPECHECK" ;;
            test) has="$HAS_MAKEFILE_TEST" ;;
            esac
            if [ "$has" != true ]; then
              echo false
              return
            fi
            recipe="$(extract_makefile_recipe "$1")"
            if echo "$recipe" | is_trivial_makefile_recipe; then
              echo false
              return
            fi
            if [ "$2" = "." ]; then
              echo true
              return
            fi
            if echo "$recipe" | grep -qE "(^|[^A-Za-z0-9_.])${2}([^A-Za-z0-9_.]|\$)"; then
              echo true
            else
              echo false
            fi
          }
          # Single braced block, not six individual redirects (shellcheck SC2129) -
          # the only spot in this step where that pattern was worth avoiding rather
          # than adding to the pre-existing, already-documented SC2129 count in
          # self-lint.yml's own suppression comment.
          {
            echo "trust_makefile_lint_for_node=$(compute_makefile_trust lint "$NODE_DIR")"
            echo "trust_makefile_typecheck_for_node=$(compute_makefile_trust typecheck "$NODE_DIR")"
            echo "trust_makefile_test_for_node=$(compute_makefile_trust test "$NODE_DIR")"
            echo "trust_makefile_lint_for_python=$(compute_makefile_trust lint "$PYTHON_DIR")"
            echo "trust_makefile_typecheck_for_python=$(compute_makefile_trust typecheck "$PYTHON_DIR")"
            echo "trust_makefile_test_for_python=$(compute_makefile_trust test "$PYTHON_DIR")"
          } >> "$GITHUB_OUTPUT"

          echo "has_package_json=$([ -f "$NODE_DIR/package.json" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          # H1 review fix: every Node step below used to hardcode `npm`, with no
          # detection at all - a pnpm-only or yarn-only repo (a lockfile other than
          # package-lock.json, no npm one) hit `npm ci`'s own hard failure
          # ("can only install with an existing package-lock.json") on its very
          # first PR, no escape hatch (the recommended Makefile.node template's own
          # install target was itself `npm ci`). `packageManager` (Corepack's own
          # field, checked first - matches real Corepack precedence) wins over
          # lockfile inference; default stays npm when neither signal is present, so
          # every existing npm-only consumer's behavior is byte-for-byte unchanged.
          PM_FIELD=""
          if [ -f "$NODE_DIR/package.json" ]; then
            PM_FIELD=$(jq -r '.packageManager // empty' "$NODE_DIR/package.json" 2>/dev/null || echo "")
          fi
          if [ -n "$PM_FIELD" ]; then
            NODE_PACKAGE_MANAGER="${PM_FIELD%%@*}"
          elif [ -f "$NODE_DIR/pnpm-lock.yaml" ]; then
            NODE_PACKAGE_MANAGER="pnpm"
          elif [ -f "$NODE_DIR/yarn.lock" ]; then
            NODE_PACKAGE_MANAGER="yarn"
          else
            NODE_PACKAGE_MANAGER="npm"
          fi
          echo "node_package_manager=$NODE_PACKAGE_MANAGER" >> "$GITHUB_OUTPUT"
          echo "has_python=$([ -f "$PYTHON_DIR/pyproject.toml" ] || [ -f "$PYTHON_DIR/requirements.txt" ] || [ -f "$PYTHON_DIR/setup.py" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Written as an if/else, not a chain: `A || B || C && grep` binds as
          # `((A||B||C) && grep)`, so the grep on pyproject.toml gated ALL three
          # branches and a repo configured via mypy.ini reported false - mypy silently
          # never ran for it.
          if [ -f "$PYTHON_DIR/mypy.ini" ] || [ -f "$PYTHON_DIR/.mypy.ini" ] || grep -q '^\[tool\.mypy\]' "$PYTHON_DIR/pyproject.toml" 2>/dev/null; then
            echo "has_mypy_config=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_mypy_config=false" >> "$GITHUB_OUTPUT"
          fi
          echo "uses_uv=$([ -f Makefile ] && grep -qE '(^|[^a-zA-Z])uv([^a-zA-Z]|$)' Makefile && echo true || ([ -f "$PYTHON_DIR/pyproject.toml" ] && [ -f "$PYTHON_DIR/uv.lock" ] && echo true || echo false))" >> "$GITHUB_OUTPUT"
          echo "uses_node=$([ -f "$NODE_DIR/.nvmrc" ] || [ -f "$NODE_DIR/.node-version" ] || grep -qE '(^|[^a-zA-Z])(nvm|node)([^a-zA-Z]|$)' Makefile 2>/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"

          # WP5: audit-ci has no default config filename of its own (its CLI always
          # requires an explicit --config path) - these three names, checked in this
          # order, are this workflow's own detection convention. The winning filename
          # is emitted bare (no $NODE_DIR prefix): the audit-ci step below runs with
          # working-directory: node-directory, so it needs the path relative to there.
          if [ -f "$NODE_DIR/audit-ci.jsonc" ]; then
            AUDIT_CI_CONFIG="audit-ci.jsonc"
          elif [ -f "$NODE_DIR/audit-ci.json" ]; then
            AUDIT_CI_CONFIG="audit-ci.json"
          elif [ -f "$NODE_DIR/.audit-ci.json" ]; then
            AUDIT_CI_CONFIG=".audit-ci.json"
          else
            AUDIT_CI_CONFIG=""
          fi
          echo "has_audit_ci_config=$([ -n "$AUDIT_CI_CONFIG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "audit_ci_config_path=$AUDIT_CI_CONFIG" >> "$GITHUB_OUTPUT"

          # WP5: `.bandit-baseline.json` (this workflow's own filename - see the WP5
          # comment block above `jobs:` for why `.bandit`/`bandit.yaml` don't count).
          echo "has_bandit_baseline=$([ -f "$PYTHON_DIR/.bandit-baseline.json" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          # WP5: `.pip-audit-ignore` (this workflow's own convention - pip-audit ships
          # no config-file allowlist mechanism at all to name a file after).
          echo "has_pip_audit_ignore=$([ -f "$PYTHON_DIR/.pip-audit-ignore" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # ---------- Tooling install (needed by Path 1 — make ci) ----------
      # H8: enable-cache/cache-dependency-glob are documented, zero-extra-infra
      # options on this exact action (verified against astral-sh/setup-uv's own
      # README, v3.2.4) - not previously used anywhere in this file. Multiple
      # glob lines (the action's own documented multi-pattern syntax) because
      # uses_uv can be true via the Makefile-grep path without uv.lock
      # necessarily existing - an empty-string glob is the action's own
      # documented "never invalidate" behavior, not a hard failure, so an
      # unmatched pattern here degrades to a less-precise cache key, not an
      # error. Globs are relative to the repo root per the action's own docs,
      # so python-directory is spliced in via format() to scope correctly for
      # a monorepo, same pattern this file already uses for hashFiles below.
      - name: Install uv
        if: steps.detect.outputs.uses_uv == 'true'
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          # No `python-version` here: setup-uv@v3 does not accept one (added in v5)
          # and Actions ignores unknown inputs with only a warning. Python comes from
          # the setup-python step below, for uv and non-uv alike.
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: |
            ${{ inputs.python-directory }}/uv.lock
            ${{ inputs.python-directory }}/pyproject.toml
            ${{ inputs.python-directory }}/requirements*.txt

      # H8: `cache:` (a documented, zero-extra-infra option on this exact
      # action) is gated on has_package_json specifically, NOT this step's own
      # broader `if:` above - the step also runs when only uses_node is true
      # (Makefile-only Node detection, no package.json at all), and enabling a
      # cache there would point cache-dependency-path at a lockfile that
      # doesn't exist, which actions/setup-node treats as an error (unlike
      # setup-uv's glob, which has a documented graceful empty case - verified
      # against actions/setup-node's own behavior notes, not assumed the same).
      # H1: cache TYPE matches the detected package manager (npm/pnpm/yarn -
      # actions/setup-node supports all three natively), and
      # cache-dependency-path points at exactly that manager's own lockfile,
      # not a multi-pattern guess across all three.
      - name: Install Node.js
        if: steps.detect.outputs.has_package_json == 'true' || steps.detect.outputs.uses_node == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: ${{ steps.detect.outputs.has_package_json == 'true' && steps.detect.outputs.node_package_manager || '' }}
          cache-dependency-path: >-
            ${{ steps.detect.outputs.node_package_manager == 'pnpm' && format('{0}/pnpm-lock.yaml', inputs.node-directory) ||
                 steps.detect.outputs.node_package_manager == 'yarn' && format('{0}/yarn.lock', inputs.node-directory) ||
                 format('{0}/package-lock.json', inputs.node-directory) }}

      # H1: only needed for pnpm/yarn - npm ships with Node itself. If
      # `packageManager` is set, Corepack pins the exact declared version on
      # first invocation (fully reproducible); if only a lockfile was found (no
      # `packageManager` field), Corepack installs its own "known good" default
      # for that manager instead - a minor, documented non-determinism (see
      # docs/repo-onboarding.md), not blocking.
      - name: Enable Corepack
        if: steps.detect.outputs.has_package_json == 'true' && steps.detect.outputs.node_package_manager != 'npm'
        run: corepack enable

      # ---------- System Python for non-uv Python projects ----------
      # Gated on has_python ALONE, deliberately. An earlier version of this fix
      # guarded it with `uses_uv != 'true'` and deleted the second setup-python that
      # had covered the uv path - which left uv repos with NO interpreter, because
      # astral-sh/setup-uv@v3 has no `python-version` input and installs only the uv
      # binary. Every Python repo gets exactly one interpreter, here, at 3.12.
      # H8: `cache: 'pip'` needs no extra conditional (this step's own `if:` -
      # has_python alone - already guarantees at least one of the three
      # manifest shapes below exists). `setup.py` is included alongside
      # requirements.txt/pyproject.toml because has_python can be true via
      # setup.py alone, with neither of the other two present - omitting it
      # would leave that shape with no file for the glob to match.
      - name: Set up Python
        if: steps.detect.outputs.has_python == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            ${{ inputs.python-directory }}/requirements.txt
            ${{ inputs.python-directory }}/pyproject.toml
            ${{ inputs.python-directory }}/setup.py

      # ---------- Path 1: Makefile-driven ----------
      # Root-only detection kept as-is (same as WP6's directory-input scope for the
      # native npm/Python steps): a Makefile that drives `make ci`/discrete targets
      # for a subdirectory-only stack is real but rarer than the
      # root-Makefile-orchestrating-subdirectories shape citevyn already uses (its
      # root Makefile's `ci:` target itself cds into backend/). A `makefile-directory`
      # input remains out of scope here, same as before WP7. (This is a different
      # question from which STACK a root Makefile target actually covers once it
      # exists - see the STACK-DIRECTORY-AWARE SKIP note above `jobs:` for that.)
      #
      # WP7 (F6/F7, target architecture point 3): discrete targets get invoked
      # individually, each with this workflow's own blocking severity - see the WP7
      # comment above `jobs:` for the full rationale. When a discrete target exists
      # for a check, the matching native npm/Python step for that SAME check (below,
      # Path 2/3) is skipped via its own `if:` - see each native step's condition.
      - name: Run make lint
        if: steps.detect.outputs.has_makefile_lint == 'true'
        run: make lint

      - name: Run make typecheck
        if: steps.detect.outputs.has_makefile_typecheck == 'true'
        run: make typecheck

      - name: Run make test
        if: steps.detect.outputs.has_makefile_test == 'true'
        run: make test

      # FALLBACK ONLY - not a second, independent Makefile path. Runs when the
      # Makefile has a `ci:` target (has_makefile_ci) but NONE of the three discrete
      # targets above exist to invoke instead. This is the "consumer-owned escape
      # hatch" target architecture point 3 names explicitly: `make ci`'s own exit code
      # decides pass/fail, and whatever severity choices happen inside it (which of
      # its own sub-steps are allowed to fail silently) are the repo's Makefile's
      # call, not this workflow's - genuinely not the same guarantee the discrete
      # targets above give.
      # KNOWN, ACCEPTED RESIDUAL (documented, not an oversight): unlike the
      # discrete-target case, this fallback does NOT skip the native npm/Python steps
      # below - there is no discrete per-check signal here to key a skip off (an
      # opaque `make ci` might run lint, typecheck, tests, all three, or none; this
      # workflow can't tell from the outside), so a repo using ONLY opaque `make ci`
      # keeps today's collision-prone F6/F7 behavior: both `make ci` and the matching
      # native steps run, and whichever finishes last silently overrides the other's
      # severity call for that check. That is left as-is here rather than guessed at.
      # Repos that want the real fix above need to split `lint`/`typecheck`/`test` out
      # of their Makefile into their own targets (citevyn already has) - once they do,
      # the three discrete steps above take over per-check and this fallback (and its
      # residual) stops applying to them.
      - name: Run make ci (fallback - opaque, repo-owned severity)
        if: >-
          steps.detect.outputs.has_makefile_ci == 'true' &&
          steps.detect.outputs.has_makefile_lint == 'false' &&
          steps.detect.outputs.has_makefile_typecheck == 'false' &&
          steps.detect.outputs.has_makefile_test == 'false'
        run: make ci

      # ---------- Path 2: Node ----------
      # H1: dispatches on node_package_manager (npm/pnpm/yarn, from "Detect
      # project layout" above) instead of hardcoding npm - a pnpm-only or
      # yarn-only repo (a lockfile other than package-lock.json) used to hit
      # `npm ci`'s own hard failure here on every single PR, no escape hatch.
      # Every existing npm-only consumer is unaffected: node_package_manager
      # defaults to npm when no pnpm-lock.yaml/yarn.lock/packageManager field is
      # present, so the `*)` branch below is byte-for-byte what ran before.
      - name: Install Node dependencies
        if: steps.detect.outputs.has_package_json == 'true'
        working-directory: ${{ inputs.node-directory }}
        run: |
          case "${{ steps.detect.outputs.node_package_manager }}" in
          pnpm) pnpm install --frozen-lockfile ;;
          yarn) yarn install --immutable ;;
          *) npm ci ;;
          esac

      # H2/H7: skipped only when the root Makefile's `lint:` target is TRUSTED for
      # node-directory (non-trivial recipe, and mentions the directory by name if
      # it's not '.') - see the WP7 header comment's "STACK-DIRECTORY-AWARE,
      # CONTENT-AWARE SKIP" bullet. Untrusted (missing, trivial, or doesn't
      # demonstrably cover this directory) means this step runs alongside `make
      # lint` rather than being skipped.
      # H1: the `jq` existence check (rather than each manager's own "run a
      # possibly-missing script" flag) is deliberate - npm's `--if-present` is
      # verified to no-op cleanly; pnpm/yarn's equivalents were not independently
      # verified here, so a single, manager-agnostic check standing in front of
      # all three avoids trusting an unverified flag on either of the newly
      # added managers.
      - name: Node lint
        if: >-
          steps.detect.outputs.has_package_json == 'true' &&
          steps.detect.outputs.trust_makefile_lint_for_node == 'false'
        working-directory: ${{ inputs.node-directory }}
        run: |
          if jq -e '.scripts.lint' package.json > /dev/null 2>&1; then
            case "${{ steps.detect.outputs.node_package_manager }}" in
            pnpm) pnpm run lint ;;
            yarn) yarn run lint ;;
            *) npm run lint --if-present ;;
            esac
          fi

      # H2/H7: same mechanism as Node lint above, for `typecheck:`.
      - name: Node typecheck
        if: >-
          steps.detect.outputs.has_package_json == 'true' &&
          steps.detect.outputs.trust_makefile_typecheck_for_node == 'false'
        working-directory: ${{ inputs.node-directory }}
        run: |
          if jq -e '.scripts.typecheck' package.json > /dev/null 2>&1; then
            case "${{ steps.detect.outputs.node_package_manager }}" in
            pnpm) pnpm run typecheck ;;
            yarn) yarn run typecheck ;;
            *) npm run typecheck --if-present ;;
            esac
          fi

      # H2/H7: same mechanism as Node lint above, for `test:`. citevyn's own
      # `frontend/` case (root Makefile's `test:` target never mentions
      # `frontend`) stays untrusted, so this still runs - no coverage regression.
      - name: Node test
        if: >-
          steps.detect.outputs.has_package_json == 'true' &&
          steps.detect.outputs.trust_makefile_test_for_node == 'false'
        working-directory: ${{ inputs.node-directory }}
        run: |
          if jq -e '.scripts.test' package.json > /dev/null 2>&1; then
            case "${{ steps.detect.outputs.node_package_manager }}" in
            pnpm) pnpm run test ;;
            yarn) yarn run test ;;
            *) npm test --if-present ;;
            esac
          fi

      - name: Node build
        if: steps.detect.outputs.has_package_json == 'true'
        working-directory: ${{ inputs.node-directory }}
        run: |
          if jq -e '.scripts.build' package.json > /dev/null 2>&1; then
            case "${{ steps.detect.outputs.node_package_manager }}" in
            pnpm) pnpm run build ;;
            yarn) yarn run build ;;
            *) npm run build --if-present ;;
            esac
          fi

      # ADVISORY. A transitive dev-dependency advisory with no fix available would
      # otherwise block every unrelated PR in the repo. BLOCKING WHEN: node-directory
      # has an audit-ci config (audit-ci.jsonc / audit-ci.json / .audit-ci.json - see
      # "Detect project layout" above) - the "npm audit (high+, audit-ci) — blocking"
      # step below runs instead of this one when that's true, machine-checked via
      # `has_audit_ci_config`, not just this comment (F10).
      # Crash-vs-finding: npm audit --json returns a "vulnerabilities" key on a genuine
      # report (empty or not) and only an "error" key when the run itself failed
      # (registry unreachable, etc.) - same exit code (1) either way, verified locally
      # against a live vs. a deliberately-unreachable registry. A crashed/offline npm
      # audit fails this step outright instead of being swallowed as advisory noise.
      # H1: this step's crash-vs-finding JSON parsing was verified specifically
      # against npm's own `audit --json` output shape (see above) - pnpm/yarn's
      # audit JSON shapes were not independently verified here, so this stays
      # npm-only rather than risk silently mis-parsing a crash as a clean run
      # (or vice versa) for a manager whose output was never checked. A pnpm/
      # yarn repo gets a clear notice instead of a wrong result; the BLOCKING
      # audit-ci step below needs no such split - audit-ci already auto-detects
      # the package manager from the lockfile itself.
      - name: npm audit (high+) — advisory
        if: >-
          steps.detect.outputs.has_package_json == 'true' &&
          steps.detect.outputs.has_audit_ci_config == 'false' &&
          steps.detect.outputs.node_package_manager == 'npm'
        working-directory: ${{ inputs.node-directory }}
        run: |
          set +e
          AUDIT_JSON=$(npm audit --audit-level=high --json)
          AUDIT_EXIT=$?
          set -e
          if [ "$AUDIT_EXIT" -eq 0 ]; then
            echo "npm audit: no high+ severity advisories."
            exit 0
          fi
          if echo "$AUDIT_JSON" | jq -e 'has("vulnerabilities")' > /dev/null 2>&1; then
            echo "$AUDIT_JSON" | jq -r '.metadata.vulnerabilities | to_entries[] | "\(.key): \(.value)"'
            echo "::warning::npm audit found high+ advisories (advisory step, not blocking)"
          else
            echo "$AUDIT_JSON"
            echo "::error::npm audit failed to run (registry/network error, not a finding) - exit $AUDIT_EXIT"
            exit "$AUDIT_EXIT"
          fi

      # H1: pnpm/yarn counterpart of the notice above - this step's own JSON
      # parsing is npm-specific, so a non-npm repo without an audit-ci config
      # gets an explicit, visible notice instead of silently having no advisory
      # dependency-audit coverage at all.
      - name: node audit (advisory) — not available for this package manager
        if: >-
          steps.detect.outputs.has_package_json == 'true' &&
          steps.detect.outputs.has_audit_ci_config == 'false' &&
          steps.detect.outputs.node_package_manager != 'npm'
        run: |
          echo "::warning::Advisory dependency audit is only implemented for npm today (this repo uses ${{ steps.detect.outputs.node_package_manager }}). Add an audit-ci config to get BLOCKING coverage instead (audit-ci auto-detects pnpm/yarn) - see docs/repo-onboarding.md."

      # BLOCKING WHEN node-directory ships an audit-ci config (see "Detect project
      # layout" above). Bare `npm audit` cannot consume an allowlist at all - only the
      # actual `audit-ci` tool reads one (F10: the original design promoted on this
      # condition without ever invoking the tool that understands it). No swallow: an
      # allowlisted repo declaring "promote me" means every remaining finding is
      # unreviewed by definition, so any non-zero exit here (a real finding OR a
      # crashed/offline audit-ci) fails the step - unlike npm audit/pip-audit,
      # audit-ci's own exit code doesn't need extra output-sniffing to tell those apart
      # for this step's purposes, because both cases are "this needs a human" once the
      # repo has opted in to blocking.
      # Gated on has_package_json too, matching every other stack-conditional pair in
      # this file (the advisory sibling above, and both bandit/pip-audit blocking
      # steps). A stray audit-ci.json with no package.json alongside it (leftover
      # frontend, mid-migration monorepo) would otherwise run this step anyway and hit
      # audit-ci's own hard `resolvePackageManagerType` error for a missing lockfile -
      # an opaque failure instead of a clean skip. has_package_json being true also
      # guarantees `npm ci` above already found a real lockfile (npm ci itself requires
      # one), so audit-ci's package-manager auto-detection has something to find.
      # --high is passed explicitly on the CLI, not left to the repo's config file.
      # Verified against audit-ci 7.1.0's source (lib/model.ts mapVulnerabilityLevelInput
      # / lib/config.ts): if a config sets none of low/moderate/high/critical, the
      # resulting severity map is all-false and Model.process() silently drops every
      # advisory - the step exits 0 and prints "Passed npm security audit." even against
      # a real, unignored critical vulnerability. Reproduced locally: an audit-ci.json
      # containing only an allowlist (no severity field - a config a maintainer could
      # easily write by copying just the allowlist section of the README) let a pinned
      # critical lodash CVE through with EXIT=0. --high forces a floor of "high or
      # higher" regardless of what the config omits, matching this step's own name;
      # it does NOT loosen a stricter repo choice, because audit-ci's level-selection
      # picks the strictest of low/moderate/high/critical that's set to true from any
      # source (CLI or config) - reproduced locally too: the same fixture with --high
      # added correctly failed (EXIT=1, "Failed security audit due to critical, high
      # vulnerabilities").
      - name: npm audit (high+, audit-ci) — blocking
        if: steps.detect.outputs.has_package_json == 'true' && steps.detect.outputs.has_audit_ci_config == 'true'
        working-directory: ${{ inputs.node-directory }}
        run: npx --yes audit-ci@7.1.0 --config "${{ steps.detect.outputs.audit_ci_config_path }}" --high

      # ---------- Path 3: Python ----------
      # NOTE: no `setup-python` here. A second one used to sit at this point pinned to
      # '3.11', running unconditionally for any Python repo — so it overrode the 3.12
      # step above and silently undid the v3 commit titled "Pin Python 3.12 in reusable
      # quality gate". Python is set up once, above, at 3.12.

      # These versions are pinned by hand, not by a manifest file, so
      # dependabot.yml (github-actions ecosystem only, by design — see its own
      # header comment) cannot bump them: there is no automated update path.
      # That's an accepted tradeoff of pinning over floating "latest", not an
      # oversight — but it means pip-audit and bandit here can go stale against
      # newly-disclosed CVEs/rules until someone manually revisits this list.
      - name: pip install tools
        if: steps.detect.outputs.has_python == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.2 pytest==9.1.1 mypy==2.3.0 bandit==1.9.4 pip-audit==2.10.1

      - name: pip install -r requirements.txt
        if: steps.detect.outputs.has_python == 'true'
        working-directory: ${{ inputs.python-directory }}
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then
            # WP-Consumer fix: a PEP 735 `[dependency-groups]` `dev` group (where
            # citevyn's own pytest-asyncio/fakeredis/etc. live) is NOT installed by
            # plain `pip install -e .` - reproduced directly: a fresh venv seeded
            # this way raised ModuleNotFoundError for both packages, then failed 6
            # real tests with them missing.
            #
            # Round-1 Codex review caught a grep-based `[dependency-groups]`/`dev`
            # check both missing valid TOML (compact `dev=[...]`, quoted `"dev"`,
            # indented, spaced `[ dependency-groups ]`) and false-positiving on an
            # unrelated table also containing a `dev` key elsewhere in the file -
            # fixed by parsing with `tomllib` (stdlib since Python 3.11, and this
            # step runs after "Set up Python" pins 3.12) instead, verified against 9
            # real-world TOML variants including both failure modes.
            #
            # Round-1's first attempt used `uv pip install --group dev`, which
            # round-2 Codex review caught as broken in the ACTUAL runner
            # environment: `actions/setup-python` puts Python on PATH but creates no
            # virtualenv, and `uv pip install` requires one (or `--system`) - every
            # earlier local verification of this fix had (accidentally) run inside
            # an activated venv, masking the failure; reproduced directly outside
            # one: "error: No virtual environment found". Simplified instead: `pip`
            # itself has supported `--group` natively since 25.1 (PEP 735), and this
            # step's very first line already upgrades pip - so `uv` isn't needed
            # here at all. Verified: plain `pip install --group dev -e .` (no venv,
            # no uv) installs cleanly against citevyn's real pyproject.toml and both
            # pytest_asyncio/fakeredis import afterward.
            #
            # KNOWN, ACCEPTED RESIDUAL (round-2 Codex findings, not fixed here -
            # narrowed deliberately rather than chasing full PEP 735 generality for
            # a hypothetical repo shape no current consumer has): a group name that
            # needs PEP 503 normalization to match `dev` (e.g. `Dev`) is not
            # detected; a malformed pyproject.toml is silently treated as "no dev
            # group" (falls back to the pre-existing `pip install -e .` behavior,
            # same swallow-tolerant convention as the rest of this step, not a new
            # regression); a PEP 735 project with dependency groups but no
            # installable package (`-e .` itself would fail) isn't handled
            # specially. None of these apply to citevyn, the one real consumer this
            # fix targets today - revisit if a future consumer's shape needs them.
            HAS_DEV_GROUP=$(python3 -c "import tomllib; d = tomllib.load(open('pyproject.toml', 'rb')); print('true' if 'dev' in d.get('dependency-groups', {}) else 'false')" 2>/dev/null || echo false)
            if [ "$HAS_DEV_GROUP" = "true" ]; then
              pip install --group dev -e . || true
            else
              pip install -e . || true
            fi
          fi

      # H2/H7: skipped only when the root Makefile's `lint:` target is TRUSTED for
      # python-directory - see the WP7 header comment's "STACK-DIRECTORY-AWARE,
      # CONTENT-AWARE SKIP" bullet. Untrusted means this step runs alongside
      # `make lint` rather than being skipped.
      - name: ruff check
        if: >-
          steps.detect.outputs.has_python == 'true' &&
          steps.detect.outputs.trust_makefile_lint_for_python == 'false'
        working-directory: ${{ inputs.python-directory }}
        run: ruff check .

      # BLOCKING. This previously read `pytest -q || echo "pytest failed"`, which
      # swallowed the exit code AND printed a line that reads like a failure report
      # while the job went green. A red test suite must fail the gate.
      # Exit 5 is pytest's "no tests were collected", which this condition cannot
      # rule out: `pyproject.toml` satisfies it whether or not a suite exists. A repo
      # with no tests must not go red for having nothing to run - but a FAILING suite
      # must, so only 5 is tolerated and it says so in the log.
      # hashFiles patterns are always relative to GITHUB_WORKSPACE (they ignore
      # working-directory), so python-directory is spliced into each pattern via
      # format() to check for tests inside the declared Python subdirectory.
      # H2/H7: skipped only when the root Makefile's `test:` target is TRUSTED for
      # python-directory (non-trivial, and mentions the directory by name if not
      # '.') - see the WP7 header comment's "STACK-DIRECTORY-AWARE, CONTENT-AWARE
      # SKIP" bullet. citevyn's own real `test: cd backend && uv run pytest`
      # target, with python-directory: backend, is now TRUSTED (its recipe
      # mentions "backend") - this step correctly skips instead of re-running the
      # same suite (H7's measured ~70-80% redundant-wall-clock finding).
      - name: pytest
        if: >-
          steps.detect.outputs.has_python == 'true' &&
          steps.detect.outputs.trust_makefile_test_for_python == 'false' &&
          hashFiles(
            format('{0}/tests/**', inputs.python-directory),
            format('{0}/test/**', inputs.python-directory),
            format('{0}/pytest.ini', inputs.python-directory),
            format('{0}/pyproject.toml', inputs.python-directory)
          ) != ''
        working-directory: ${{ inputs.python-directory }}
        run: pytest -q || { c=$?; [ $c -eq 5 ] && echo "::warning::pytest collected no tests" || exit $c; }

      # H2/H7: skipped only when the root Makefile's `typecheck:` target is
      # TRUSTED for python-directory - see the WP7 header comment's
      # "STACK-DIRECTORY-AWARE, CONTENT-AWARE SKIP" bullet. Untrusted means this
      # step runs alongside `make typecheck` rather than being skipped.
      - name: mypy
        if: >-
          steps.detect.outputs.has_python == 'true' &&
          steps.detect.outputs.has_mypy_config == 'true' &&
          steps.detect.outputs.trust_makefile_typecheck_for_python == 'false'
        working-directory: ${{ inputs.python-directory }}
        run: mypy .

      # ADVISORY. Bandit's false-positive rate on application code is high enough that
      # blocking on a bare run would train people to ignore it. BLOCKING WHEN:
      # python-directory ships a generated baseline JSON at `.bandit-baseline.json`
      # (see "Detect project layout" above) - the "bandit (baseline) — blocking" step
      # below runs instead of this one when that's true, machine-checked via
      # `has_bandit_baseline`, not just this comment. Deliberately NOT keyed off
      # `.bandit`/`bandit.yaml`: those are bandit CLI config (excludes, thresholds),
      # not a baseline report, and passing one to `-b` fails outright (F10 correction).
      # Crash-vs-finding: bandit's own exit codes already separate these (verified
      # against bandit 1.9.4's source, bandit/cli/main.py): 0 = no issues, 1 = issues
      # found at/above threshold, 2 = bandit itself failed (bad args, unreadable
      # target, etc.). A crash (exit >= 2) fails this step outright instead of being
      # swallowed as advisory noise.
      # KNOWN, NOT FIXED (Codex review, WP5): this 0/1/2 split isn't exhaustive.
      # Per-file scan errors inside bandit's own run are caught and skipped
      # internally without changing the process exit code, so a file bandit
      # couldn't parse can still yield exit 0 ("clean") for the rest of the tree.
      # A crash inside bandit's own report *formatter* (as opposed to the scan
      # itself) surfaces as a plain exit 1, indistinguishable here from a real
      # finding. Both are narrow, source-confirmed edge cases in bandit's own
      # error handling, not something this step's exit-code branching can
      # distinguish further without parsing bandit's own diagnostic output -
      # left as a documented residual rather than a deeper fix here.
      - name: bandit — advisory
        if: steps.detect.outputs.has_python == 'true' && steps.detect.outputs.has_bandit_baseline == 'false'
        working-directory: ${{ inputs.python-directory }}
        run: |
          set +e
          bandit -r . -x tests,test,node_modules,.venv,venv
          BANDIT_EXIT=$?
          set -e
          case "$BANDIT_EXIT" in
            0) echo "bandit: no issues identified." ;;
            1) echo "::warning::bandit reported findings (advisory step, not blocking)" ;;
            *)
              echo "::error::bandit failed to run (exit $BANDIT_EXIT) - not a clean/findings result"
              exit "$BANDIT_EXIT"
              ;;
          esac

      # BLOCKING WHEN python-directory ships `.bandit-baseline.json` (see "Detect
      # project layout" above and the ADVISORY step's comment for why `.bandit`/
      # `bandit.yaml` don't count). Generate the baseline with
      # `bandit -r . -f json -o .bandit-baseline.json`. `-b`/`--baseline` makes bandit
      # report only issues NOT already present in that file, so a repo shipping one is
      # declaring its existing findings reviewed-and-accepted — anything new fails. No
      # swallow: same crash-vs-finding exit-code split as the advisory step (0/1 = ran,
      # >= 2 = bandit itself failed).
      # Note: a malformed `.bandit-baseline.json` is NOT one of those exit-code paths.
      # Verified against bandit 1.9.4's source (bandit/core/manager.py,
      # populate_baseline()): on invalid JSON, bandit logs a warning and continues with
      # an empty baseline rather than raising - so every pre-existing finding then reads
      # as "new" and this step fails at exit 1 (over-blocks), not exit >= 2. That's a
      # fail-safe outcome, not a security gap, but it means a corrupted baseline reads
      # in the log as ordinary new findings, not as "your baseline file is broken."
      - name: bandit (baseline) — blocking
        if: steps.detect.outputs.has_python == 'true' && steps.detect.outputs.has_bandit_baseline == 'true'
        working-directory: ${{ inputs.python-directory }}
        run: |
          set +e
          bandit -r . -x tests,test,node_modules,.venv,venv -b .bandit-baseline.json
          BANDIT_EXIT=$?
          set -e
          case "$BANDIT_EXIT" in
            0) echo "bandit: no new findings vs. .bandit-baseline.json." ;;
            1)
              echo "::error::bandit reported findings not present in .bandit-baseline.json"
              exit 1
              ;;
            *)
              echo "::error::bandit failed to run (exit $BANDIT_EXIT)"
              exit "$BANDIT_EXIT"
              ;;
          esac

      # ADVISORY, same reasoning as npm audit. BLOCKING WHEN: python-directory ships a
      # `.pip-audit-ignore` file (see "Detect project layout" above) - the "pip-audit
      # (ignore-list) — blocking" step below runs instead of this one when that's true,
      # machine-checked via `has_pip_audit_ignore`, not just this comment. pip-audit has
      # no config-file allowlist mechanism at all (F10 correction to the original
      # design, which assumed one existed) - `.pip-audit-ignore` is this workflow's own
      # convention: one vulnerability ID (e.g. `PYSEC-2023-74` or `GHSA-...`) per line,
      # blank lines and `#`-prefixed comments ignored, each surviving line passed as
      # its own `--ignore-vuln <ID>`.
      # Crash-vs-finding: pip-audit's exit code does NOT separate these on its own
      # (verified against pip-audit 2.10.1's source, pip_audit/_cli.py: a genuine
      # finding and a fatal error - e.g. the vulnerability service being unreachable -
      # both call `sys.exit(1)`, confirmed locally by forcing a connection failure).
      # The one signal pip-audit emits only on a genuine report is its own summary
      # line, "Found N known vulnerabilit(y|ies)…" (verified present on a real findings
      # run, absent on the forced-failure run, which logs an ERROR through a different
      # code path, `_fatal()`, instead). A crash fails this step outright instead of
      # being swallowed as advisory noise.
      # `--strict`: without it, pip-audit can skip a dependency it fails to resolve
      # and still exit 0 - a partial audit silently reading as "clean" (Codex review
      # finding on WP5). `--strict` makes a skipped dependency a hard failure instead.
      # Known, tracked, NOT fixed here: this scans whatever's actually installed in
      # the job's venv, not a lockfile - and the install step above it is
      # `pip install -e . || true` (swallows install failures). A partial/inconsistent
      # install can therefore still get audited as if it succeeded. That's the same
      # `|| true` swallow already tracked against the native install step generally
      # (gate-severity-table note, "native Python install") - fixing it there fixes
      # this step's blind spot too; not duplicated here to avoid two places owning
      # one fix.
      # WP-Consumer fix: `--strict` treats the local package itself (installed via
      # `pip install -e .` just above, always unresolvable via a PyPI lookup by
      # definition - it's not a third-party dependency) as a hard failure, not just
      # a skip - reproduced directly against citevyn's real pyproject.toml: exit 1,
      # "Dependency not found on PyPI and could not be audited". `--skip-editable`
      # alone does not fix this - empirically, pip-audit 2.10.1 still hard-fails an
      # explicitly-skipped editable package when `--strict` is also set ("distribution
      # marked as editable", still exit 1).
      #
      # Round-1 Codex review correctly rejected this fix's first version (dropping
      # `--strict` outright, keeping only `--skip-editable`): that weakens the audit
      # for EVERY Python consumer, not just ones with an editable-install problem -
      # a genuinely unresolvable THIRD-PARTY dependency (private index, direct URL,
      # yanked release) would then silently read as skipped instead of failing,
      # reopening exactly the gap WP5's original `--strict` fix (Codex-driven then,
      # too) closed. Fixed properly instead: snapshot the environment with
      # `pip freeze --all --exclude-editable` (the local package is never listed, so
      # pip-audit never tries to resolve it) and audit that snapshot with `-r`,
      # keeping `--strict` fully intact for every other dependency. `--all` matters -
      # bare `pip freeze` silently omits pip/setuptools/wheel by default, which would
      # have re-introduced a different blind spot; verified `--all` includes pip
      # while `--exclude-editable` still excludes the local package. Verified all
      # three cases against citevyn's real pyproject.toml: a real vulnerability
      # (forced via a known-vulnerable pinned pip) still fails with `--strict` intact
      # and the "Found N known vulnerabilities" line present; a clean environment
      # exits 0; the editable package present and nothing else wrong exits 0 without
      # ever being resolved against PyPI.
      #
      # KNOWN, ACCEPTED RESIDUAL (round-2 Codex finding, not fixed here):
      # `--exclude-editable` excludes every editable install in the environment, not
      # only this repo's own package - a consumer with an ADDITIONAL editable
      # third-party/VCS dependency would have that one skipped too, not just
      # audited-and-clean. Narrowing to exclude only the current project specifically
      # would need reading back the distribution name pip assigned it, adding real
      # complexity for a shape no current consumer (citevyn included) has - revisit
      # if one does.
      - name: pip-audit — advisory
        if: steps.detect.outputs.has_python == 'true' && steps.detect.outputs.has_pip_audit_ignore == 'false'
        working-directory: ${{ inputs.python-directory }}
        run: |
          # Round-2 Codex review: the snapshot itself must be generated OUTSIDE
          # `set +e` - otherwise a `pip freeze` failure (or an empty/partial file)
          # silently produces a clean-looking audit of nothing, not a crash. Only
          # `pip-audit` itself (whose real finding/crash distinction is handled
          # below) runs with `set +e`.
          PIP_AUDIT_SNAPSHOT="$(mktemp)"
          pip freeze --all --exclude-editable > "$PIP_AUDIT_SNAPSHOT"
          set +e
          OUTPUT=$(pip-audit --strict -r "$PIP_AUDIT_SNAPSHOT" 2>&1)
          PIP_AUDIT_EXIT=$?
          rm -f "$PIP_AUDIT_SNAPSHOT"
          set -e
          echo "$OUTPUT"
          if [ "$PIP_AUDIT_EXIT" -eq 0 ]; then
            exit 0
          fi
          if echo "$OUTPUT" | grep -qE '^Found [0-9]+ known vulnerabilit'; then
            echo "::warning::pip-audit reported findings (advisory step, not blocking)"
            exit 0
          fi
          echo "::error::pip-audit failed to run (exit $PIP_AUDIT_EXIT) - not a genuine vulnerability report"
          exit "$PIP_AUDIT_EXIT"

      # BLOCKING WHEN python-directory ships `.pip-audit-ignore` (see "Detect project
      # layout" above and the ADVISORY step's comment for the file format and why
      # pip-audit needs this workflow to invent one). Every surviving ID becomes its
      # own `--ignore-vuln <ID>`; anything pip-audit still reports past that filter is
      # by definition unreviewed, so no swallow. Same crash-vs-finding signal as the
      # advisory step - and the same `pip freeze --all --exclude-editable` snapshot
      # fix, for the same reason: the local editable package can never be resolved
      # via PyPI, so auditing it directly hard-fails this step on every PR for any
      # repo using `pip install -e .`, promoted (blocking) or not - while keeping
      # `--strict` fully intact for every other dependency. See the advisory step's
      # comment above for the full empirical verification.
      - name: pip-audit (ignore-list) — blocking
        if: steps.detect.outputs.has_python == 'true' && steps.detect.outputs.has_pip_audit_ignore == 'true'
        working-directory: ${{ inputs.python-directory }}
        run: |
          IGNORE_ARGS=()
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%%#*}"
            line="$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            IGNORE_ARGS+=(--ignore-vuln "$line")
          done < .pip-audit-ignore
          # Round-2 Codex review: snapshot generation stays outside `set +e` - see
          # the advisory step's comment above for why.
          PIP_AUDIT_SNAPSHOT="$(mktemp)"
          pip freeze --all --exclude-editable > "$PIP_AUDIT_SNAPSHOT"
          set +e
          OUTPUT=$(pip-audit --strict -r "$PIP_AUDIT_SNAPSHOT" "${IGNORE_ARGS[@]}" 2>&1)
          PIP_AUDIT_EXIT=$?
          rm -f "$PIP_AUDIT_SNAPSHOT"
          set -e
          echo "$OUTPUT"
          if [ "$PIP_AUDIT_EXIT" -eq 0 ]; then
            exit 0
          fi
          if echo "$OUTPUT" | grep -qE '^Found [0-9]+ known vulnerabilit'; then
            echo "::error::pip-audit reported findings not present in .pip-audit-ignore"
            exit "$PIP_AUDIT_EXIT"
          fi
          echo "::error::pip-audit failed to run (exit $PIP_AUDIT_EXIT)"
          exit "$PIP_AUDIT_EXIT"

      # ---------- Fallback: nothing matched ----------
      # WP7: the has_makefile_lint/typecheck/test checks are added here too - a repo
      # with a Makefile that ONLY defines discrete targets (no `ci:` target, no
      # package.json, no Python manifest) would otherwise hit this notice-and-skip
      # step despite `make lint`/`typecheck`/`test` above having actually run.
      - name: No recognized project files
        if: >-
          steps.detect.outputs.has_makefile_ci == 'false' &&
          steps.detect.outputs.has_makefile_lint == 'false' &&
          steps.detect.outputs.has_makefile_typecheck == 'false' &&
          steps.detect.outputs.has_makefile_test == 'false' &&
          steps.detect.outputs.has_package_json == 'false' &&
          steps.detect.outputs.has_python == 'false'
        run: |
          echo "::notice::No Makefile ci target, package.json, or Python project files detected."
          echo "::notice::Falling back to secret scan only. Consider adding a Makefile or language manifest."