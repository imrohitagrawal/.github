        run: scripts/assert-fixture-job.sh

  assert-npm-audit-blocking-fixture-blocks:
    name: assert npm-audit-blocking actually blocked
    needs: [npm-audit-blocking]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The marker is audit-ci's own verdict line, which it prints only after
      # actually evaluating advisories against the configured severity floor -
      # so this also catches the silent all-false-severity-map failure the
      # explicit `--high` flag exists to prevent (audit-ci would exit 0 with
      # "Passed npm security audit." instead).
      - name: Check the unallowlisted lodash CVEs blocked via audit-ci
