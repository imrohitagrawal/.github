  assert-bad-directory-input-blocks:
    name: assert bad-directory-input actually blocked
    needs: [bad-directory-input]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check the nonexistent directory input failed closed, by name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_JOB: bad-directory-input / quality-gate
          ACTUAL_RESULT: ${{ needs.bad-directory-input.result }}
          EXPECT_RESULT: failure
          EXPECT_PATTERN: "##\\[error\\]python-directory '[^']*does-not-exist' does not exist in this repository"
          FAILURE_HINT: "WP6's fail-closed directory validation is not actually failing closed - see the silent-stack-disable bug its own comment describes."
        run: scripts/assert-fixture-job.sh

  # ROUND-4 (HIGH): the `-true` trust regression guard. If
  # is_trivial_makefile_recipe stops recognising Make's `-` prefix, the root
  # Makefile's `lint:` target earns trust for this fixture's directory, the
  # native `ruff check .` step is SKIPPED, and the fixture job goes GREEN with
  # its deliberate F401 unexamined. Both halves matter: the result check
  # catches the skip, and the log marker proves the failure really was ruff.
  assert-makefile-trust-dash-negative-blocks:
    name: assert makefile-trust-dash-negative actually blocked
    needs: [makefile-trust-dash-negative]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check the native ruff step ran and failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_JOB: makefile-trust-dash-negative / quality-gate
          ACTUAL_RESULT: ${{ needs.makefile-trust-dash-negative.result }}
          EXPECT_RESULT: failure
          EXPECT_PATTERN: 'F401 .* imported but unused'
          FAILURE_HINT: "The native ruff step did not run for this fixture, which means compute_makefile_trust wrongly TRUSTED the root Makefile's `-true` lint recipe - the H2 false-green class, via Make's `-` prefix. scripts/test-makefile-trust.sh covers the same function directly and should name the exact case."
        run: scripts/assert-fixture-job.sh

  # ROUND-4 review fix: root-makefile-and-semgrep exists (per its own comment)
  # to prove two things that had never executed at all - WP7's Makefile
  # dispatch and the Semgrep step. Its value therefore depends entirely on a
  # specific step having RUN, and it had no assert job, while this file's own
  # header claimed every such fixture now had one. Rather than narrow the
  # claim, close the gap: semgrep's own scan-summary line is the marker.
  #
  # `Ran N rules? on M files` is real semgrep output, not the echoed `run:`
  # body (which contains only the `semgrep scan --error --config ...`
  # command).
  #
  # M IS DELIBERATELY UNCONSTRAINED, and the first version of this assertion
  # got that wrong. It required `[1-9][0-9]*` files - "a step that runs but
  # scans nothing must be a failure" - which is false, because this step
  # passes `--baseline-commit`: the scan is DIFF-SCOPED. Measured, after two
  # review lenses disagreed about it:
  #   full scan, no baseline            -> "Ran 1 rule on 13 files"
  #   this PR (4 yaml files changed)    -> "Ran 1 rule on 4 files"
  #   --baseline-commit HEAD (0 changed)-> "Ran 1 rule on 0 files"
  # So M is the count of CHANGED yaml files, not repo content. A docs-only,
  # scripts-only or fixture-only PR legitimately scans zero, and the strict
  # version of this pattern would have turned the required `self-test` check
  # RED on a defect-free PR while blaming a missing semgrep config.
  #
  # What this therefore proves is that the Semgrep step RAN TO COMPLETION -
  # which is the actual question, since its `if:` is a root-scoped
  # hashFiles() that could silently stop matching. It does not prove any
  # particular file was scanned, and that is correct: on most PRs, none
  # should be.
  #
  # MEASURED WHILE WRITING THIS, and worth recording because a deleted
  # comment nearby used to claim the opposite ("it doesn't run for any of
  # this file's six scenario jobs"): the Semgrep step's `if:` is
  # hashFiles() over REPO-ROOT paths and this repo's root ships semgrep.yml,
  # so Semgrep runs in EVERY fixture job, not just this one. Confirmed
  # against run 31639687237 - python-only, node-only and this job all log
  # "Ran 1 rule on 4 files: 0 findings." So this assertion is not unique to
  # this job; it is simply the job designated to own the claim. The real
  # cost that follows - one Docker pull and one identical 4-file scan per
  # fixture job, currently 18 of them per run - is a consequence of the
  # reusable workflow's documented root-scoped detection, not something this
  # file can fix, and is written into the round-4 backlog rather than
  # silently absorbed.
  assert-semgrep-actually-ran:
    name: assert root-makefile-and-semgrep really ran semgrep
    needs: [root-makefile-and-semgrep]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check semgrep scanned at least one file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_JOB: root-makefile-and-semgrep / quality-gate
          ACTUAL_RESULT: ${{ needs.root-makefile-and-semgrep.result }}
          EXPECT_RESULT: success
          EXPECT_PATTERN: '^[^ ]+ Ran [0-9]+ rules? on [0-9]+ files'
          FAILURE_HINT: "The Semgrep step did not run to completion. Its `if:` requires a semgrep config at the REPO ROOT (semgrep.yml / .semgrep.yml / .semgrep/ / semgrep/) - a green job with no scan-summary line means the gate's only cross-language security scan is silently skipped for every consumer that ships one. Note a scan of ZERO files is normal and expected: the step passes --baseline-commit, so it only scans yaml the PR actually changed."
        run: scripts/assert-fixture-job.sh

  # ROUND-4 (LOW): the marker is the runner's echo of setup-uv's RESOLVED
  # `enable-cache` input, not just the step header.
  #
  # Review finding, and a fair one: the first version matched only
  # "Run astral-sh/setup-uv@", which the runner prints whenever the step
  # executes at all. That proves `uses_uv` was true and says nothing about
  # `has_uv_cache_target` - the output the zero-match-glob guard actually
  # keys on. Mutating `enable-cache` to a hardcoded `true` left every job
  # green while the fixture's own text claimed the guard was covered: the
  # same "the assertion is satisfied by something other than what it claims"
  # shape as the pip-audit bug this whole round exists for. Matching the
  # resolved input closes it (verified present in the real log:
  # "  enable-cache: true", inside the step's own `with:` group).
  #
  # STILL UNCOVERED, deliberately: the guard's NEGATIVE side - uses_uv true
  # via the root-Makefile grep with no python manifest anywhere, where
  # enable-cache must resolve to false or setup-uv hard-fails on a
  # zero-match glob. That needs a fixture whose job makes the ROOT Makefile
  # mention uv, which would turn uv detection on for every other job in this
  # file at once. Backlogged, not silently skipped.
  assert-uv-cache-step-ran:
    name: assert python-uv-cache installed uv
    needs: [python-uv-cache]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check setup-uv ran for the uv.lock fixture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_JOB: python-uv-cache / quality-gate
          ACTUAL_RESULT: ${{ needs.python-uv-cache.result }}
          EXPECT_RESULT: success
          EXPECT_PATTERN: '^[^ ]+   enable-cache: true$'
          FAILURE_HINT: "Either uses_uv did not evaluate true for a python-directory containing both pyproject.toml and uv.lock (so setup-uv never ran), or has_uv_cache_target did not evaluate true (so caching was never enabled and the zero-match-glob guard is still unexercised). Check whether 'Run astral-sh/setup-uv@' appears in that job's log at all: present means the second case, absent means the first."
        run: scripts/assert-fixture-job.sh

  # ISSUE #23: the marker is yarn's own install banner. Yarn Classic and Berry
  # both print "yarn install v<version>", so this proves the yarn arm of
  # "Install Node dependencies" really ran without pinning a major.
  assert-yarn-install-ran:
    name: assert node-yarn-only installed via yarn
    needs: [node-yarn-only]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check the yarn arm of the native install step ran
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_JOB: node-yarn-only / quality-gate
          ACTUAL_RESULT: ${{ needs.node-yarn-only.result }}
          EXPECT_RESULT: success
          EXPECT_PATTERN: '^[^ ]+ yarn install v[0-9]'
          FAILURE_HINT: "node_package_manager did not resolve to yarn for a repo with a packageManager field of yarn@1.22.22 and a yarn.lock, so the gate's yarn dispatch is still unexercised - the arm that shipped a silently-ignored --immutable flag."
        run: scripts/assert-fixture-job.sh

  assert-node-build-violation-blocks:
    name: assert node-build-violation actually blocked
    needs: [node-build-violation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check the deliberately-broken fixture failed the gate, via build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_JOB: node-build-violation / quality-gate
          ACTUAL_RESULT: ${{ needs.node-build-violation.result }}
          EXPECT_RESULT: failure
          EXPECT_PATTERN: '^[^ ]+ > self-test-node-build-violation@[0-9.]+ build$'
          FAILURE_HINT: "npm build is not actually blocking - the swallow-regression class recorded as an accepted residual since C1 has reopened."
        run: scripts/assert-fixture-job.sh

  # H4 (review finding): scripts/retrofit-quality-gate.sh had zero test
  # coverage of any kind - not even run once in CI, despite being a
  # ~465-line script with real git side effects (branch creation, commits,
  # optional push/PR). Runs the real functional test suite
  # (scripts/test-retrofit-quality-gate.sh) against throwaway scratch repos
  # under $RUNNER_TEMP, never this checkout itself. fetch-depth: 0 below so
  # the suite's T11 case can resolve tag v6 against this repo's own history
  # (catching "PINNED_SHA silently drifted behind the real tag", not just
  # internal self-consistency) - this is also the regression test for H3's
  # doubled-version-comment fix.
  retrofit-script-tests:
    name: retrofit-quality-gate.sh functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run functional test suite
        run: scripts/test-retrofit-quality-gate.sh

  self-test:
    name: self-test
    needs:
      - node-only
      - node-pnpm-only
      - python-only
      - monorepo
      - root-makefile-and-semgrep
      - makefile-trust-positive
      - python-dev-group
      - assert-negative-fixture-blocks
      - assert-python-negative-fixture-blocks
      - assert-bandit-blocking-fixture-blocks
      - assert-npm-audit-blocking-fixture-blocks
      - assert-pip-audit-blocking-fixture-blocks
      - assert-pip-audit-advisory-warns
      - assert-node-typecheck-violation-fixture-blocks
      - assert-python-mypy-violation-fixture-blocks
      - assert-bad-directory-input-blocks
      - assert-makefile-trust-dash-negative-blocks
      - assert-uv-cache-step-ran
      - assert-semgrep-actually-ran
      - assert-yarn-install-ran
      - assert-node-build-violation-blocks
      - retrofit-script-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Aggregate scenario results
        env:
          NODE_ONLY: ${{ needs.node-only.result }}
          NODE_PNPM_ONLY: ${{ needs.node-pnpm-only.result }}
          PYTHON_ONLY: ${{ needs.python-only.result }}
          MONOREPO: ${{ needs.monorepo.result }}
          ROOT_MAKEFILE_SEMGREP: ${{ needs.root-makefile-and-semgrep.result }}
          MAKEFILE_TRUST_POSITIVE: ${{ needs.makefile-trust-positive.result }}
          PYTHON_DEV_GROUP: ${{ needs.python-dev-group.result }}
          NEGATIVE_ASSERT: ${{ needs.assert-negative-fixture-blocks.result }}
          PYTHON_NEGATIVE_ASSERT: ${{ needs.assert-python-negative-fixture-blocks.result }}
          BANDIT_BLOCKING_ASSERT: ${{ needs.assert-bandit-blocking-fixture-blocks.result }}
          NPM_AUDIT_BLOCKING_ASSERT: ${{ needs.assert-npm-audit-blocking-fixture-blocks.result }}
          PIP_AUDIT_BLOCKING_ASSERT: ${{ needs.assert-pip-audit-blocking-fixture-blocks.result }}
          PIP_AUDIT_ADVISORY_ASSERT: ${{ needs.assert-pip-audit-advisory-warns.result }}
          NODE_TYPECHECK_ASSERT: ${{ needs.assert-node-typecheck-violation-fixture-blocks.result }}
          PYTHON_MYPY_ASSERT: ${{ needs.assert-python-mypy-violation-fixture-blocks.result }}
          BAD_DIRECTORY_ASSERT: ${{ needs.assert-bad-directory-input-blocks.result }}
          DASH_TRUST_ASSERT: ${{ needs.assert-makefile-trust-dash-negative-blocks.result }}
          UV_CACHE_ASSERT: ${{ needs.assert-uv-cache-step-ran.result }}
          SEMGREP_ASSERT: ${{ needs.assert-semgrep-actually-ran.result }}
          YARN_ASSERT: ${{ needs.assert-yarn-install-ran.result }}
          NODE_BUILD_ASSERT: ${{ needs.assert-node-build-violation-blocks.result }}
          RETROFIT_SCRIPT_TESTS: ${{ needs.retrofit-script-tests.result }}
        run: |
          echo "node-only: $NODE_ONLY"
          echo "node-pnpm-only: $NODE_PNPM_ONLY"
          echo "python-only: $PYTHON_ONLY"
          echo "monorepo: $MONOREPO"
          echo "root-makefile-and-semgrep: $ROOT_MAKEFILE_SEMGREP"
          echo "makefile-trust-positive: $MAKEFILE_TRUST_POSITIVE"
          echo "python-dev-group: $PYTHON_DEV_GROUP"
          echo "assert-negative-fixture-blocks: $NEGATIVE_ASSERT"
          echo "assert-python-negative-fixture-blocks: $PYTHON_NEGATIVE_ASSERT"
          echo "assert-bandit-blocking-fixture-blocks: $BANDIT_BLOCKING_ASSERT"
          echo "assert-npm-audit-blocking-fixture-blocks: $NPM_AUDIT_BLOCKING_ASSERT"
          echo "assert-pip-audit-blocking-fixture-blocks: $PIP_AUDIT_BLOCKING_ASSERT"
          echo "assert-pip-audit-advisory-warns: $PIP_AUDIT_ADVISORY_ASSERT"
          echo "assert-node-typecheck-violation-fixture-blocks: $NODE_TYPECHECK_ASSERT"
          echo "assert-python-mypy-violation-fixture-blocks: $PYTHON_MYPY_ASSERT"
          echo "assert-bad-directory-input-blocks: $BAD_DIRECTORY_ASSERT"
          echo "assert-makefile-trust-dash-negative-blocks: $DASH_TRUST_ASSERT"
          echo "assert-uv-cache-step-ran: $UV_CACHE_ASSERT"
          echo "assert-semgrep-actually-ran: $SEMGREP_ASSERT"
          echo "assert-yarn-install-ran: $YARN_ASSERT"
          echo "assert-node-build-violation-blocks: $NODE_BUILD_ASSERT"
          echo "retrofit-script-tests: $RETROFIT_SCRIPT_TESTS"
          FAILED=0
          for r in "$NODE_ONLY" "$NODE_PNPM_ONLY" "$PYTHON_ONLY" "$MONOREPO" "$ROOT_MAKEFILE_SEMGREP" "$MAKEFILE_TRUST_POSITIVE" "$PYTHON_DEV_GROUP" \
            "$NEGATIVE_ASSERT" "$PYTHON_NEGATIVE_ASSERT" "$BANDIT_BLOCKING_ASSERT" \
            "$NPM_AUDIT_BLOCKING_ASSERT" "$PIP_AUDIT_BLOCKING_ASSERT" "$PIP_AUDIT_ADVISORY_ASSERT" \
            "$NODE_TYPECHECK_ASSERT" "$PYTHON_MYPY_ASSERT" "$BAD_DIRECTORY_ASSERT" \
            "$DASH_TRUST_ASSERT" "$UV_CACHE_ASSERT" "$SEMGREP_ASSERT" "$YARN_ASSERT" \
            "$NODE_BUILD_ASSERT" "$RETROFIT_SCRIPT_TESTS"; do
            if [ "$r" != "success" ]; then
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more self-test scenarios did not produce their expected result."
            exit 1
          fi
          echo "All self-test scenarios produced their expected result."
