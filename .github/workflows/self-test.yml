        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The marker is the RENDERED annotation, not the `echo "::error::..."`
      # source line the step's own script body puts in the log regardless.
      # FORBID_PATTERN pins the crash-vs-finding split: bandit exiting >= 2
      # (it itself failed) must never be mistaken for the finding this
      # fixture exists to prove blocks.
      - name: Check the unbaselined bandit finding blocked, and not a crash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
