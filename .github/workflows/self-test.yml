          EXPECT_PATTERN: '^[^ ]+ Failed security audit due to .*vulnerabilities\.$'
          FAILURE_HINT: "WP5's audit-ci blocking promotion is not actually blocking on lodash@4.17.4's real, unallowlisted advisories."
        run: scripts/assert-fixture-job.sh

  # THIS is the assert job round 4 exists for. Its old form checked only
  # `needs.python-pip-audit-blocking.result != 'failure'` and reported success
  # on every run for months while the fixture was failing on a pip
  # dependency-RESOLUTION crash - never once on the vulnerability finding it
  # exists to prove blocks. Verified by replaying this exact assertion against
  # the real, already-merged run 31635781539 before the fixture fix: it fails,
  # naming the missing marker. See the fixture's requirements.txt.
  assert-pip-audit-blocking-fixture-blocks:
    name: assert python-pip-audit-blocking actually blocked
    needs: [python-pip-audit-blocking]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check the unignored CVEs blocked, and not a resolver crash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_JOB: python-pip-audit-blocking / quality-gate
          ACTUAL_RESULT: ${{ needs.python-pip-audit-blocking.result }}
          EXPECT_RESULT: failure
          EXPECT_PATTERN: '##\[error\]pip-audit reported findings not present in \.pip-audit-ignore'
          FORBID_PATTERN: '##\[error\]pip-audit failed to run'
          FAILURE_HINT: "WP5's pip-audit ignore-list blocking promotion did not block on a genuine finding. If the FORBIDDEN marker matched, pip-audit crashed instead of reporting - most likely a tool pin in reusable-pr-quality.yml's 'pip install tools' step now conflicts with this fixture's deliberately vulnerable pin, which is exactly the round-3 bug this assertion was written to catch."
        run: scripts/assert-fixture-job.sh

  # ROUND-4: the advisory twin of the assert above. A passing job proves
  # nothing on its own here - the whole point is that pip-audit found
  # something real and CHOSE not to block, which is only visible in the log.
  assert-pip-audit-advisory-warns:
    name: assert python-pip-audit-advisory warned without blocking
    needs: [python-pip-audit-advisory]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check pip-audit warned on a real finding without failing the job
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_JOB: python-pip-audit-advisory / quality-gate
          ACTUAL_RESULT: ${{ needs.python-pip-audit-advisory.result }}
          EXPECT_RESULT: success
          EXPECT_PATTERN: '##\[warning\]pip-audit reported findings \(advisory step, not blocking\)'
          FORBID_PATTERN: '##\[error\]pip-audit failed to run'
          FAILURE_HINT: "The advisory pip-audit path did not reach its 'found something real, warn but do not block' branch. A green job with no warning means pip-audit found nothing (the fixture's vulnerable pin stopped being vulnerable, or never got installed) - not that the advisory path works."
        run: scripts/assert-fixture-job.sh

