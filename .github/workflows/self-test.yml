name: Self-test (reusable-pr-quality.yml)

# WP1 (F1/F25 - "the bootstrap repo does not consume its own product"):
# exercises reusable-pr-quality.yml via workflow_call against real,
# checked-in fixture scenarios (.github/self-test-fixtures/) - proving the
# reusable workflow's own detection/dispatch logic actually works before
# it's ever tagged, not just that its YAML parses. Before this file, the
# workflow shipped to every consumer had zero runs, ever (F1).
#
# `uses: ./.github/workflows/reusable-pr-quality.yml` (a same-repo relative
# path, not `imrohitagrawal/.github/.github/workflows/...@<ref>` the way
# templates/caller-pr-quality.yml calls it) is deliberate: GitHub resolves a
# relative-path reusable-workflow call at the exact commit of the CALLING
# workflow run, so on a PR that touches reusable-pr-quality.yml, this
# exercises the PR's own changes - not a previously-merged tag, which
# wouldn't exist yet for an in-flight PR and wouldn't validate what's
# actually changing.
#
# 36 jobs: the original ten (seven workflow_call scenario jobs, two assert
# jobs inverting the two deliberately-failing scenarios' results, and the
# final aggregate job) plus, since the review that added C1/H4/H1 below,
# eight more (six deliberately-failing scenario+assert pairs - bandit-
# baseline, audit-ci, pip-audit-ignore, npm typecheck, mypy, and a
# nonexistent directory input - plus a pnpm-only should-pass scenario, plus
# a should-pass scenario proving the trust=true Makefile-skip path actually
# fires, not just that its logic is correct in isolation) and a
# functional-test job for scripts/retrofit-quality-gate.sh, plus three
# scenario+assert pairs added in round 4 (makefile-trust-dash-negative,
# python-pip-audit-advisory, python-uv-cache - see each job's own comment)
# and one more assert job added by round 4's own review, covering the
# previously-unasserted root-makefile-and-semgrep scenario.
# See each job's own comment for what it proves and why:
#   - node-only, node-pnpm-only (H1: a real pnpm-only repo - packageManager
#     field + pnpm-lock.yaml, no package-lock.json - proving
#     node_package_manager detection/dispatch works end-to-end, not just
#     that npm-only repos keep working), python-only, monorepo (WP6
#     python-directory/node-directory inputs), root-makefile-and-semgrep
#     (this repo's own root - formerly `no-manifest`, see that job's own
#     comment for why it was repurposed and the real trade-off that came
#     with it), python-dev-group (WP-Consumer fix, added after a real
#     Codex finding on PR #16: a PEP 735 [dependency-groups] dev
#     dependency, freezegun, that's declared nowhere else and confirmed
#     absent from every pinned tool's own transitive deps - proves
#     `pip install --group dev -e .` actually installs it, not just that
#     the tomllib-based detection's YAML parses; verified to genuinely fail
#     with ModuleNotFoundError against a venv where the dev group was
#     deliberately NOT installed, before being checked in) - all expected
#     to PASS. Each fixture has real, executable content (not empty
#     placeholder files) - see each directory under
#     .github/self-test-fixtures/ and its own comments - validated locally
#     before being checked in by extracting and running the exact commands
#     reusable-pr-quality.yml runs (npm ci / npm run lint,typecheck,test,
#     build / pip install / ruff / pytest / mypy / bandit / pip-audit)
#     against each fixture directory in a clean venv.
#   - node-lint-violation - a fixture whose package.json "lint" script
#     deliberately `process.exit(1)`s - expected to FAIL. This is one of
#     two scenarios that give the self-test real teeth: without it, this
#     file only proves detection/routing works for clean input - it would
#     stay green even if someone reintroduced `continue-on-error: true` on
#     the reusable workflow's own npm-lint step (the exact historical bug
#     fixed in c07ddce, before which nothing but gitleaks could fail this
#     gate for a Node repo).
#   - python-test-failure - a fixture with a genuinely failing pytest
#     assertion - expected to FAIL. Added during this file's own Phase-3
#     adversarial review, which found that node-lint-violation alone proved
#     only ONE of reusable-pr-quality.yml's ~7 documented historical
#     severity-swallow bugs stays fixed. This covers a second, different
#     one (pytest's swallow) on a second, different stack (Python) -
#     proving the negative-fixture pattern generalizes, not that it was
#     only ever exercised once.
#   - python-bandit-blocking, npm-audit-blocking, python-pip-audit-blocking -
#     C1 (review finding): WP5's three blocking-promotion paths had never
#     executed in this repo's own CI at all (self-test's root has no
#     Makefile, and no fixture had a promotion-trigger file), proven by
#     mutation. Each pins a real, permanently-published vulnerability
#     (bandit: a deliberate subprocess/shell=True finding not in an empty
#     baseline; npm: lodash@4.17.4's real GHSA advisories via audit-ci;
#     Python: PyYAML==5.3's real PYSEC advisories via an ignore-list that
#     doesn't cover them) - verified locally against the real tools/
#     registries before being checked in, same discipline as every other
#     fixture here.
#   - node-typecheck-violation, python-mypy-violation - C1: closes the
#     residual noted below (npm typecheck and mypy previously had no
#     negative-fixture proof, only pytest and npm-lint did).
#   - bad-directory-input - C1: proves WP6's fail-closed directory
#     validation (added after an earlier version silently disabled a stack
#     while staying green) still rejects a nonexistent path.
#   KNOWN, ACCEPTED RESIDUAL (narrowed by the above, not fully closed): npm
#   build's swallow-regression class still has no covering negative
#   fixture - `--if-present` makes constructing a "build fails but nothing
#   else does" fixture cheaply is harder than the others above; not built
#   out here given diminishing returns, see the C1 fix package's own notes.
#   `continue-on-error` cannot be set on a job that calls a reusable
#   workflow via `uses:` (verified with actionlint: "when a reusable
#   workflow is called with 'uses', 'continue-on-error' is not available")
#   - so node-lint-violation and python-test-failure are BOTH EXPECTED TO
#   SHOW RED on every self-test run. That is correct, not a bug in this
#   file. The real pass/fail signal for each is its own assert job below,
#   and the final aggregate job (what branch protection should require)
#   accounts for both expected failures correctly.
#
# assert-negative-fixture-blocks / assert-python-negative-fixture-blocks
# invert their fixture's result: each fails (redding out the aggregate) if
# that fixture's job did NOT fail, i.e. if the gate silently let a real
# violation through. `if: always()` makes each run regardless of its own
# fixture job's outcome.
#
# ROUND-4 (HIGH): every assert job below now ALSO greps its fixture job's
# real log, via scripts/assert-fixture-job.sh, for a marker only the intended
# step can emit - the job-level `needs.<job>.result` check alone is not
# enough, and that was not a theoretical concern. python-pip-audit-blocking
# spent its entire life failing on a pip dependency-RESOLUTION crash instead
# of the vulnerability finding it exists to prove blocks, and its assert job
# reported success on every single run, because the job was red either way.
# See scripts/assert-fixture-job.sh's own header for the mechanism and the
# pattern-writing rule (match the RENDERED "##[error]..." annotation or real
# tool output - never the echoed source of an `echo "::error::..."` line,
# which appears in the log whether or not that branch ran).
#
# self-test (the aggregate) is the one stable job name to point branch
# protection at (WP0, once that's configured) - same reasoning
# reusable-pr-quality.yml's own header comment gives for staying a single
# job: one name, regardless of which scenarios ran, with no "a required job
# quietly reports skipped and counts as green" hazard.
#
# STRUCTURAL LIMITATION - CLOSED IN ROUND 4 for every fixture that has an
# assert job. It used to read: self-test can only observe JOB-level results
# via `needs.<job>.result`, so nothing here could distinguish "a step
# genuinely ran and passed/failed" from "a step's `if:` silently evaluated
# false and got skipped" or "some unrelated step crashed first". That was
# real, and it cost this effort a whole review round (see the assert-job
# comment above `on:`). The proposed fix at the time was `outputs:` on
# reusable-pr-quality.yml, deferred as out of scope.
#
# Round 4 closes it a different way, with no change to the reusable workflow
# at all: scripts/assert-fixture-job.sh reads the fixture job's real log from
# the Actions API (`actions: read`) and requires a step-specific marker to be
# present - and, where a wrong-reason pass is the specific hazard, requires
# another marker to be ABSENT. Every deliberately-failing fixture has one, as
# do the should-pass fixtures whose entire value is that a specific step RAN:
# python-pip-audit-advisory, python-uv-cache, root-makefile-and-semgrep.
#
# RESIDUAL (narrowed, not eliminated) - five should-pass scenarios are still
# job-result-only, and the exemption list is spelled out rather than implied,
# because an earlier version of this paragraph claimed "every" and was wrong
# about two of them:
#   - node-only, node-pnpm-only, python-only, monorepo. Their value is "a
#     normal repo of this shape passes cleanly end to end", which a green job
#     does evidence; a silently-skipped step inside one would go unnoticed.
#     Log assertions for each of their ~10 steps is a bigger, lower-yield job.
#   - python-dev-group. Weaker than the four above, and worth naming: its
#     fixture's own test imports freezegun, so if the PEP 735 dev-group
#     install path regresses, that test fails and the job goes red by itself -
#     but only IF the pytest step ran at all. A narrowed `if:` that skipped
#     pytest would leave it green and silent. An assert job for it is cheap
#     and is in the round-4 backlog.
#
# HARD-REQUIREMENT PROOF (done once, for real, not asserted - see the WP1
# commit message for exactly what was broken, run, observed, and reverted):
# before this file was committed in its current form, the "npm lint" step's
# exact `npm run lint --if-present` command was extracted from
# reusable-pr-quality.yml and run locally against this file's
# node-lint-violation fixture both as-is (real exit 1, matching what this
# job now correctly reports as failure) and with a `|| true` swallow
# reintroduced (the shell-level form of the pre-c07ddce continue-on-error
# bug) appended, which silently turned that same exit 1 into exit 0 despite
# identical fixture content - reproducing exactly the failure mode this
# negative fixture and its assert job exist to catch, then reverted.

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
# No `paths:` filter (round-1 fix, real Codex finding): a required
# status check whose triggering workflow has a `paths:` filter never gets
# CREATED at all for a PR that doesn't touch those paths - GitHub then
# shows that required check as permanently "Expected"/pending, and the
# merge button never unblocks, for e.g. a docs-only or CODEOWNERS-only PR
# that never touches .github/workflows/**. This also directly matches
# section 5 of the governing plan (audit-and-redesign-fancy-cascade.md):
# "self-test + first-party lint (new, WP1) ... Blocking condition: Always"
# - a path-filtered trigger would silently contradict that. Runs on every
# PR and every push to main instead; the fixture-scenario jobs are
# minimal, dependency-free fixtures (see .github/self-test-fixtures/), not
# a real build - real per-run cost hasn't been measured against this
# org's actual PR volume (round-2 review nitpick: an earlier version of
# this comment asserted "the cost ... is low" as settled fact without a
# number behind it), but the alternative - a required check that can hang
# forever for any PR that doesn't touch .github/workflows/** - is not an
# acceptable trade regardless of what that cost turns out to be.

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-only:
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      node-directory: .github/self-test-fixtures/node-only

  # H1 (review finding): before this fix, a pnpm-only repo (packageManager
  # field + pnpm-lock.yaml, no package-lock.json) hard-failed on native
  # `npm ci` on every PR, no escape hatch - the reusable workflow hardcoded
  # npm with no package-manager detection at all. Expected to PASS.
  node-pnpm-only:
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      node-directory: .github/self-test-fixtures/node-pnpm-only

  python-only:
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      python-directory: .github/self-test-fixtures/python-only

  monorepo:
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      python-directory: .github/self-test-fixtures/monorepo/backend
      node-directory: .github/self-test-fixtures/monorepo/frontend

  python-dev-group:
    # WP-Consumer fix (real Codex finding on PR #16): proves the reusable
    # workflow's `pip install --group dev -e .` path (a PEP 735
    # [dependency-groups] dev group, the exact shape citevyn's real
    # backend/pyproject.toml has) actually installs a dev-only dependency,
    # not just that the detection logic's YAML parses. See the fixture's
    # own pyproject.toml/test file comments for why `freezegun` was chosen
    # and how this was verified to genuinely fail (ModuleNotFoundError) if
    # the dev-group install path regresses.
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      python-directory: .github/self-test-fixtures/python-dev-group

  # C1 (review finding): formerly `no-manifest`, exercising "this repo's own
  # root has no recognized project files, fall back to secret-scan-only."
  # That premise is gone as of this package: this repo's root now has a
  # real Makefile and semgrep.yml (see both files' own comments), added
  # specifically so self-test's root-scoped checks (WP7's Makefile dispatch,
  # the Semgrep step) execute for real at least once, closing a bigger gap
  # than the one this trade-off costs. REAL, DELIBERATE TRADE-OFF, not an
  # oversight: has_makefile_ci is root-scoped unconditionally (see "Detect
  # project layout" in reusable-pr-quality.yml - it ignores every job's own
  # python-directory/node-directory), so once this repo's root has a
  # Makefile, NO fixture in this file can ever make has_makefile_ci
  # evaluate false again - the "no recognized project files" fallback
  # branch (reusable-pr-quality.yml's final elif/else) is now structurally
  # unreachable by self-test, permanently, from this commit forward. This
  # job now instead proves: (a) the root Makefile's discrete lint/typecheck/
  # test targets are correctly detected and dispatched to (WP7's mechanism,
  # previously untested), (b) Semgrep runs and passes cleanly against this
  # repo's real tracked content (previously never executed at all, in any
  # job, ever). No inputs: both directories default to '.', this repo's own
  # root.
  # ROUND-2 REVIEW NOTE: compute_makefile_trust has a separate, pre-existing
  # short-circuit for directory == '.' (any non-trivial recipe is trusted
  # unconditionally there, no substring match needed - see
  # reusable-pr-quality.yml's own comment on that branch). Since FR15 made
  # the root Makefile's test: target non-trivial, THIS job's own
  # trust_makefile_test_for_python/node now evaluate true too, via that
  # bypass, not via directory-name matching. Currently harmless only because
  # this repo's own root has neither a Python nor a Node manifest (has_python/
  # has_package_json are false here regardless), so no native step is gated
  # by that trust value in the first place - not because the bypass doesn't
  # apply to this job. If this repo's root ever gained a real pyproject.toml/
  # package.json while keeping default '.' directories, that native step
  # would start being skipped in favor of `make test` with no test coverage
  # catching it - flagged, not fixed, since it's not reachable today.
  root-makefile-and-semgrep:
    uses: ./.github/workflows/reusable-pr-quality.yml

  # H7 review fix (test coverage, review finding): prior coverage only
  # exercised trust=false (untrusted) paths - no fixture's directory string
  # ever appeared in the root Makefile's (previously all-trivial) recipes,
  # so the actual trust=true skip path - the mechanism that delivers H7's
  # measured ~70-80% redundant-wall-clock fix for citevyn's real shape - had
  # never fired once in CI. This fixture's tests/test_something.py has a
  # deliberately failing assertion; the root Makefile's `test:` target now
  # names this exact directory (see Makefile) and is genuinely non-trivial,
  # so compute_makefile_trust should evaluate true here and skip the native
  # pytest step entirely. Expected to PASS: if trust=true doesn't fire (a
  # future regression in the directory-matching logic), native pytest DOES
  # run, the deliberate failure fires, and this job goes red - a real
  # regression signal that didn't exist before this fixture.
  makefile-trust-positive:
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      python-directory: .github/self-test-fixtures/makefile-trust-positive

  # ROUND-4 (HIGH): the negative twin of makefile-trust-positive above.
  # compute_makefile_trust never handled Make's `-` (ignore-error) recipe
  # prefix, only `@` - so a `test:`/`lint:` recipe of `-true` was read as a
  # real command, earned full trust, and SKIPPED the native step: the exact
  # H2 false-green class the whole trust mechanism exists to close, reached
  # via a different one of Make's three standard prefixes. The root
  # Makefile's `lint:` target is now exactly that shape (`-true`, with a
  # comment naming this fixture directory so the directory-mention half of
  # the trust check is satisfied), leaving is_trivial_makefile_recipe as the
  # only thing keeping trust false here. Expected to FAIL: this fixture ships
  # a deliberate ruff F401, so if trust ever wrongly flips to true, `ruff
  # check .` is skipped, this job goes GREEN, and its assert job reports the
  # regression. scripts/test-makefile-trust.sh covers the same function
  # directly, including the directory == '.' case no fixture here can reach.
  makefile-trust-dash-negative:
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      python-directory: .github/self-test-fixtures/makefile-trust-dash-negative

  # ROUND-4: the ADVISORY pip-audit path (what every Python consumer gets by
  # default, with no `.pip-audit-ignore` opt-in) had zero fixture coverage -
  # only the blocking path had one, and that one turned out never to reach
  # its intended branch at all. Expected to PASS; the assert job is what
  # gives it teeth, by requiring the advisory warning annotation in the log.
  python-pip-audit-advisory:
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      python-directory: .github/self-test-fixtures/python-pip-audit-advisory

  # ISSUE #23: the reusable workflow's OWN native yarn path had never
  # executed. T14 in scripts/test-retrofit-quality-gate.sh covers the Makefile
  # template's yarn install, but nothing covered "Install Node dependencies"'s
  # yarn arm - the arm that shipped a silently-ignored `--immutable` for its
  # whole life (P1, fixed in #21). `packageManager` pins yarn CLASSIC on
  # purpose: Corepack picks its own major when only a lockfile is present, and
  # the bug lived in the classic branch of the runtime version check.
  # Expected to PASS.
  node-yarn-only:
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      node-directory: .github/self-test-fixtures/node-yarn-only

  # ISSUE #23: closes the npm-build swallow-regression residual recorded since
  # C1 ("--if-present makes constructing a build-only failure awkward"). The
  # workflow now gates each script on a jq existence check rather than
  # `--if-present` alone, which makes it straightforward: declare ONLY a
  # `build` script and let it exit 1. Expected to FAIL.
  node-build-violation:
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      node-directory: .github/self-test-fixtures/node-build-violation

  # ROUND-4 (LOW): uv detection (`uses_uv`/`has_uv_cache_target`) and the
  # setup-uv zero-match-glob hard-fail guard had never run in CI - no fixture
  # anywhere had a uv.lock. Expected to PASS; the assert job requires
  # setup-uv to actually appear in this job's log, since a silently-skipped
  # "Install uv" step looks identical to a passing one from outside.
  python-uv-cache:
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      python-directory: .github/self-test-fixtures/python-uv-cache

  node-lint-violation:
    # Expected to report "failure" - see the header comment above. Do not
    # "fix" this job to be green; that would defeat the scenario.
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      node-directory: .github/self-test-fixtures/node-lint-violation

  python-test-failure:
    # Expected to report "failure" - see the header comment above. Do not
    # "fix" this job to be green; that would defeat the scenario.
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      python-directory: .github/self-test-fixtures/python-test-failure

  # C1 (review finding): self-test's own repo root has no Makefile, and
  # (before this package) no fixture had an audit-ci.json/
  # .bandit-baseline.json/.pip-audit-ignore - so WP5's three blocking-
  # promotion paths and mypy/npm-typecheck's swallow-regression classes had
  # never once executed in this repo's own CI, proven by mutation (an
  # earlier session reintroduced a `make lint || true`-class swallow and
  # got a bit-for-bit identical self-test result). The six jobs below close
  # that for the promotion paths and the typecheck/mypy residual - each
  # fixture's real, blocking failure verified locally first (bandit 1.9.4,
  # audit-ci 7.1.0 + real npm registry data, pip-audit 2.10.1 + real PyPI
  # advisory data, mypy 2.3.0, node's own exit code), same discipline as
  # every other fixture in this file. Expected to FAIL, same as
  # node-lint-violation/python-test-failure above - each gets its own
  # assert job.
  python-bandit-blocking:
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      python-directory: .github/self-test-fixtures/python-bandit-blocking

  npm-audit-blocking:
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      node-directory: .github/self-test-fixtures/npm-audit-blocking

  python-pip-audit-blocking:
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      python-directory: .github/self-test-fixtures/python-pip-audit-blocking

  node-typecheck-violation:
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      node-directory: .github/self-test-fixtures/node-typecheck-violation

  python-mypy-violation:
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      python-directory: .github/self-test-fixtures/python-mypy-violation

  # WP6's fail-closed directory validation (reusable-pr-quality.yml's
  # "Validate directory inputs" step) rejects an explicitly nonexistent
  # python-directory/node-directory - added after an earlier version
  # silently disabled a stack while staying green. No fixture directory
  # needed: the point is the path does NOT exist. Expected to FAIL.
  bad-directory-input:
    uses: ./.github/workflows/reusable-pr-quality.yml
    with:
      python-directory: .github/self-test-fixtures/does-not-exist

  # HISTORICAL NOTE (round-4 review fix): a long comment used to sit here
  # arguing that this job could only observe node-lint-violation's overall JOB
  # result, that "npm lint is the only step that plausibly fails" was
  # fixture-design evidence rather than a step-level guarantee, and that a
  # full fix needed `outputs:` on reusable-pr-quality.yml. All three
  # statements stopped being true when this job started reading the fixture's
  # real log (see the header above `on:`), and the stale comment survived the
  # conversion - flagged by review, removed here rather than left to make a
  # future maintainer either redo closed work or delete the EXPECT_PATTERN
  # believing it adds nothing.
  #
  # What replaced the argument: EXPECT_PATTERN below requires npm's own
  # "> <pkg>@<version> lint" run banner in the log. An unrelated earlier
  # failure - actions/checkout, npm ci, anything - means that banner never
  # appears, and this job fails saying so.
  assert-negative-fixture-blocks:
    name: assert node-lint-violation actually blocked
    needs: [node-lint-violation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # ROUND-4: needed by scripts/assert-fixture-job.sh to read the fixture
      # job's log. Read-only, and scoped to this one job rather than raised
      # workflow-wide.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The marker is npm's own "> <pkg>@<version> lint" run banner, which
      # only appears when npm actually invoked the lint script - not the
      # workflow's `npm run lint --if-present` source line, which is echoed
      # into the log whether or not the step ran.
      - name: Check the deliberately-broken fixture failed the gate, via lint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_JOB: node-lint-violation / quality-gate
          ACTUAL_RESULT: ${{ needs.node-lint-violation.result }}
          EXPECT_RESULT: failure
          EXPECT_PATTERN: '^[^ ]+ > self-test-node-lint-violation@[0-9.]+ lint$'
          FAILURE_HINT: "The gate is not actually blocking on a real lint violation - see F1 and the c07ddce history in reusable-pr-quality.yml's header comment."
        run: scripts/assert-fixture-job.sh

  # Same known limitation and same fixture-design mitigation as
  # assert-negative-fixture-blocks above: python-test-failure/requirements.txt
  # declares no runtime dependencies (comment-only, see the file itself -
  # pip install succeeds trivially), has no mypy.ini (has_mypy_config is
  # false for this python-directory specifically, so mypy doesn't run at
  # all for it), and its only .py file lives under tests/ (bandit's own -x
  # excludes it, so bandit scans nothing and can't fail) - leaving pytest
  # as the only step that plausibly fails.
  #
  # ROUND-2 FIX, real regression caught by both Claude review lenses AND
  # Codex independently: this is not just documentation - ruff runs
  # BEFORE pytest in the reusable workflow (reusable-pr-quality.yml,
  # "ruff check" then "pytest", no continue-on-error, no `if: always()`),
  # so ruff failing first would make GitHub Actions' implicit `success()`
  # skip pytest entirely - the job would still correctly show "failure"
  # overall, but for ruff's reason, not pytest's, giving this fixture ZERO
  # actual coverage of the pytest-swallow bug it exists to guard, despite
  # an earlier version of this exact comment claiming "verified by
  # actually running every other step". The original
  # tests/test_deliberate_failure.py used a literal `assert 1 == 2`, which
  # ruff's default PLR0133 rule ("two constants compared in a comparison")
  # flags - confirmed by running the reusable workflow's exact pinned
  # `ruff==0.16.2 check .` against the fixture as it stood before this fix
  # and getting a real PLR0133 finding, exit 1. Fixed in
  # tests/test_deliberate_failure.py itself (not here) by computing the
  # left-hand side at runtime via a function call rather than a second
  # literal - re-verified after the fix: `ruff check .` now exits 0 (zero
  # findings) and `pytest -q` still exits 1 (the real assertion still
  # fails) against the same fixture directory.
  assert-python-negative-fixture-blocks:
    name: assert python-test-failure actually blocked
    needs: [python-test-failure]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # ROUND-4: the marker is pytest's own FAILED summary line naming the
      # exact test - which settles, rather than argues from fixture design,
      # the "did ruff fail first and skip pytest entirely?" question the
      # round-2 comment above had to reason its way through.
      - name: Check the deliberately-failing fixture failed the gate, via pytest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_JOB: python-test-failure / quality-gate
          ACTUAL_RESULT: ${{ needs.python-test-failure.result }}
          EXPECT_RESULT: failure
          EXPECT_PATTERN: '^[^ ]+ FAILED tests/test_deliberate_failure\.py::test_deliberately_fails'
          FAILURE_HINT: "The gate is not actually blocking on a real test failure - see the pre-c07ddce 'pytest -q || echo ...' history in reusable-pr-quality.yml's header comment."
        run: scripts/assert-fixture-job.sh

  assert-bandit-blocking-fixture-blocks:
    name: assert python-bandit-blocking actually blocked
    needs: [python-bandit-blocking]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
