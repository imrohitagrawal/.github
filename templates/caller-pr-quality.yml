name: PR Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-gate:
    if: github.event.pull_request.draft == false
    # Pinned by commit SHA, not the mutable `vN` tag, per this repo's own
    # versioning policy (see docs/repo-onboarding.md and the redesign plan's
    # section 4) -- the same SHA-pin treatment applied to third-party actions
    # inside the reusable workflow, applied one level up to the reusable
    # workflow reference itself. The `# v6` comment is for human readability
    # only; it is not consumed by GitHub. To bump: resolve the new tag's
    # commit (`git -C <clone of imrohitagrawal/.github> rev-parse vN^{commit}`)
    # and replace both the SHA and the comment together -- and check
    # scripts/retrofit-quality-gate.sh's PINNED_SHA/PINNED_TAG and
    # repo-template's own caller workflow at the same time, so this file
    # (the one docs/repo-onboarding.md tells people to copy by hand) doesn't
    # silently drift behind the others the way it did from v4 to v6.
    # self-lint's "Pin consistency check" step (scripts/check-pin-
    # consistency.sh) mechanically verifies this file agrees with
    # scripts/retrofit-quality-gate.sh on every PR -- but it cannot reach
    # repo-template, a separate repo, so that one copy still has to be
    # checked by hand, every bump, not just when this comment reminds you.
    #
    # For a monorepo, add `python-directory`/`node-directory` inputs here
    # (see docs/repo-onboarding.md) -- both default to '.', the repo root.
    uses: imrohitagrawal/.github/.github/workflows/reusable-pr-quality.yml@6bd9eec68b0fa7db8b60de89ee541666893febaa # v6